    ReportTemplateFile:
      description: The file bytes (not the JSON envelope), with its own Content-Type, `Content-Disposition attachment; filename*=UTF-8''<name>` and `X-Content-Type-Options nosniff`.
      headers:
        Content-Disposition: { schema: { type: string } }
        X-Content-Type-Options: { schema: { type: string, const: nosniff } }
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
    DocumentFile:
      description: The PDF bytes, not the JSON envelope. Sent with `Content-Disposition attachment; filename*=UTF-8''<name>` and `X-Content-Type-Options nosniff`.
      headers:
        Content-Disposition: { schema: { type: string } }
        X-Content-Type-Options: { schema: { type: string, const: nosniff } }
      content:
        application/pdf:
          schema: { type: string, format: binary }
    Empty:
      description: Done; data is an empty object.
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success: { const: true }
              data: { type: object, additionalProperties: false }
    BadRequest:
      description: Malformed id, unknown JSON field, oversized body or wrong HTTP method (code bad_request).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid credentials (code unauthorized).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The caller's project role lacks this action (code forbidden).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Missing, or the caller is not a member of the project; existence is never revealed (code not_found).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Duplicate name, archived parent, last PM, or stale_order on a move (code conflict). A write rejected because the project is archived carries error "project_archived".
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationFailed:
      description: Field errors in `fields` (code validation_failed).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [success, error, code]
      properties:
        success: { const: false }
        error: { type: string, description: English text for logs. }
        code:
          type: string
          enum: [bad_request, unauthorized, forbidden, not_found, conflict, validation_failed, server_error]
        fields:
          type: object
          description: Present with validation_failed. Maps a request field to why it failed.
          additionalProperties:
            type: string
            enum: [required, too_long, invalid, invalid_date, before_start, not_member, too_large, not_pdf]
    ProjectStatus:
      type: string
      enum: [active, on_hold, done]
    ProjectRole:
      type: string
      enum: [pm, member]
    MyRole:
      description: The caller's role in this project; admin for system admins who are not members.
      type: string
      enum: [admin, pm, member]
    Priority:
      type: string
      enum: [low, medium, high, urgent]
    LabelColor:
      type: string
      enum: [green, yellow, red, blue, purple, gray]
    User:
      type: object
      required: [id, name, avatarUrl]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        avatarUrl: { type: string }
    Me:
      type: object
      required: [user, isAdmin, canCreateProject, canViewPeople]
      properties:
        user: { $ref: '#/components/schemas/User' }
        isAdmin: { type: boolean }
        canCreateProject: { type: boolean, description: True for system admins and managers. }
        canViewPeople: { type: boolean, description: 'True for system admins and anyone who is PM of a project: they may open any person page (GET /people/{userID}).' }
    Project:
      type: object
      required: [id, name, description, ownerId, status, startDate, endDate, createdAt, updatedAt, archivedAt, myRole]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 20000 }
        ownerId: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        startDate: { type: [string, 'null'], format: date }
        endDate: { type: [string, 'null'], format: date }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: [string, 'null'], format: date-time }
        myRole: { $ref: '#/components/schemas/MyRole' }
    ProjectListItem:
      description: A project as listed, with its owner, members (pm first, then by name) and active-card progress.
      allOf:
        - $ref: '#/components/schemas/Project'
        - type: object
          required: [owner, members, cardsDone, cardsTotal, documentCount]
          properties:
            owner: { $ref: '#/components/schemas/User' }
            members: { type: array, items: { $ref: '#/components/schemas/User' } }
            cardsDone: { type: integer, description: Active cards with completedAt set. }
            cardsTotal: { type: integer, description: Cards not archived and not in an archived list. }
            documentCount: { type: integer, description: Reports that are not deleted. }
    CreateProjectInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 20000 }
        lang:
          type: string
          enum: [th, en]
          description: Language of the four default list names; empty means en.
        startDate: { type: [string, 'null'], format: date }
        endDate: { type: [string, 'null'], format: date, description: Must not be before startDate. }
    UpdateProjectInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 20000 }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        startDate: { type: [string, 'null'], description: 'A YYYY-MM-DD date. Absent leaves it; null clears it; an empty string also clears it (older clients).' }
        endDate: { type: [string, 'null'], description: 'A YYYY-MM-DD date. Absent leaves it; null clears it; an empty string also clears it (older clients).' }
    Member:
      type: object
      required: [userId, name, avatarUrl, role, addedAt]
      properties:
        userId: { type: integer, format: int64 }
        name: { type: string }
        avatarUrl: { type: string }
        role: { $ref: '#/components/schemas/ProjectRole' }
        addedAt: { type: string, format: date-time }
    AddMemberInput:
      type: object
      additionalProperties: false
      required: [userId, role]
      properties:
        userId: { type: integer, format: int64 }
        role: { $ref: '#/components/schemas/ProjectRole' }
    SetRoleInput:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/ProjectRole' }
    Label:
      type: object
      required: [id, projectId, name, color]
      properties:
        id: { type: integer, format: int64 }
        projectId: { type: integer, format: int64 }
        name: { type: string, maxLength: 40 }
        color: { $ref: '#/components/schemas/LabelColor' }
    LabelInput:
      type: object
      additionalProperties: false
      required: [name, color]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        color: { $ref: '#/components/schemas/LabelColor' }
    LabelPatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        color: { $ref: '#/components/schemas/LabelColor' }
    BoardInfo:
      type: object
      required: [id, projectId, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        projectId: { type: integer, format: int64 }
        updatedAt: { type: string, format: date-time, description: Bumped by every change the board shows; the ETag source. }
    BoardProject:
      type: object
      required: [id, name, description, ownerId, status, startDate, endDate, archivedAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        ownerId: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        startDate: { type: [string, 'null'], format: date }
        endDate: { type: [string, 'null'], format: date }
        archivedAt: { type: [string, 'null'], format: date-time }
    List:
      type: object
      required: [id, boardId, name, position, isDone, wipLimit, archivedAt]
      properties:
        id: { type: integer, format: int64 }
        boardId: { type: integer, format: int64 }
        name: { type: string, maxLength: 100 }
        position: { type: string, description: LexoRank key; sort ascending by plain byte comparison. }
        isDone: { type: boolean, description: Cards in a done list carry completedAt. }
        wipLimit: { type: [integer, 'null'], description: Reserved; always null today. }
        archivedAt: { type: [string, 'null'], format: date-time }
    CardSummary:
      type: object
      required: [id, listId, title, priority, startDate, dueDate, position, completedAt, updatedAt, labelIds, assigneeIds, checklistTotal, checklistDone, commentCount, checklistPreview]
      properties:
        id: { type: integer, format: int64 }
        listId: { type: integer, format: int64 }
        title: { type: string }
        priority: { $ref: '#/components/schemas/Priority' }
        startDate: { type: [string, 'null'], format: date }
        dueDate: { type: [string, 'null'], format: date }
        position: { type: string }
        completedAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: string, format: date-time }
        labelIds: { type: array, items: { type: integer, format: int64 } }
        assigneeIds: { type: array, items: { type: integer, format: int64 } }
        checklistTotal: { type: integer }
        checklistDone: { type: integer }
        commentCount: { type: integer, description: Excludes soft-deleted comments. }
        checklistPreview:
          type: array
          description: The first 3 checklist items by position; empty when none.
          maxItems: 3
          items:
            type: object
            required: [id, text, isDone]
            properties:
              id: { type: integer, format: int64 }
              text: { type: string }
              isDone: { type: boolean }
    BoardLabel:
      type: object
      required: [id, name, color]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        color: { $ref: '#/components/schemas/LabelColor' }
    BoardMember:
      type: object
      required: [userId, name, avatarUrl, role]
      properties:
        userId: { type: integer, format: int64 }
        name: { type: string }
        avatarUrl: { type: string }
        role: { $ref: '#/components/schemas/ProjectRole' }
    Board:
      type: object
      required: [board, project, myRole, lists, cards, labels, members, users]
      properties:
        board: { $ref: '#/components/schemas/BoardInfo' }
        project: { $ref: '#/components/schemas/BoardProject' }
        myRole: { $ref: '#/components/schemas/MyRole' }
        lists: { type: array, items: { $ref: '#/components/schemas/List' }, description: Live lists by position. }
        cards: { type: array, items: { $ref: '#/components/schemas/CardSummary' }, description: Live cards of live lists, by position. }
        labels: { type: array, items: { $ref: '#/components/schemas/BoardLabel' } }
        members: { type: array, items: { $ref: '#/components/schemas/BoardMember' } }
        users: { type: array, items: { $ref: '#/components/schemas/User' }, description: Profiles of members and of every assignee. }
    Archived:
      type: object
      required: [lists, cards]
      properties:
        lists: { type: array, items: { $ref: '#/components/schemas/List' } }
        cards: { type: array, items: { $ref: '#/components/schemas/CardSummary' } }
    CreateListInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    UpdateListInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        isDone: { type: boolean }
    MoveInput:
      type: object
      additionalProperties: false
      description: The neighbours the client saw at the drop spot. Both null means no neighbour (the item goes to an empty spot or the end).
      properties:
        beforeId: { type: [integer, 'null'], format: int64, description: Id of the item that will sit above. }
        afterId: { type: [integer, 'null'], format: int64, description: Id of the item that will sit below. }
    ChecklistItem:
      type: object
      required: [id, text, isDone, position]
      properties:
        id: { type: integer, format: int64 }
        text: { type: string, maxLength: 500 }
        isDone: { type: boolean }
        position: { type: string }
    CardDetail:
      type: object
      required: [id, createdBy, listId, title, descriptionMd, priority, startDate, dueDate, position, completedAt, createdAt, updatedAt, archivedAt, assigneeIds, labelIds, checklist]
      properties:
        id: { type: integer, format: int64 }
        createdBy: { type: integer, format: int64, description: User id of the creator. }
        listId: { type: integer, format: int64 }
        title: { type: string, maxLength: 200 }
        descriptionMd: { type: string, maxLength: 20000 }
        priority: { $ref: '#/components/schemas/Priority' }
        startDate: { type: [string, 'null'], format: date }
        dueDate: { type: [string, 'null'], format: date, description: Not before startDate. }
        position: { type: string }
        completedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archivedAt: { type: [string, 'null'], format: date-time }
        assigneeIds: { type: array, items: { type: integer, format: int64 } }
        labelIds: { type: array, items: { type: integer, format: int64 } }
        checklist: { type: array, items: { $ref: '#/components/schemas/ChecklistItem' } }
    CreateCardInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
    UpdateCardInput:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        descriptionMd: { type: string, maxLength: 20000 }
        priority: { $ref: '#/components/schemas/Priority' }
        startDate: { type: [string, 'null'], format: date, description: 'Absent leaves it; null clears it.' }
        dueDate: { type: [string, 'null'], format: date, description: 'Absent leaves it; null clears it.' }
    MoveCardInput:
      type: object
      additionalProperties: false
      required: [toListId]
      properties:
        toListId: { type: integer, format: int64 }
        beforeId: { type: [integer, 'null'], format: int64 }
        afterId: { type: [integer, 'null'], format: int64 }
    AddItemInput:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 500 }
    ItemPatch:
      type: object
      additionalProperties: false
      properties:
        text: { type: string, minLength: 1, maxLength: 500 }
        isDone: { type: boolean }
    Dashboard:
      type: object
      description: |
        Status rules match the Timeline. done is completedAt set; overdue is not done and dueDate before today; in progress is not done, not overdue and startDate on or before today; otherwise not started. Open means not done.
      required: [asOf, totals, byProject, workload, byPriority, deadlines]
      properties:
        asOf: { type: string, format: date, description: Today in Asia/Bangkok. }
        totals:
          type: object
          required: [total, done, open, inProgress, notStarted, overdue, dueSoon, unassigned]
          properties:
            total: { type: integer }
            done: { type: integer }
            open: { type: integer }
            inProgress: { type: integer }
            notStarted: { type: integer }
            overdue: { type: integer }
            dueSoon: { type: integer, description: Open cards due today through today plus 7 days. }
            unassigned: { type: integer, description: Open cards with no assignee. }
        byProject:
          type: array
          description: Every scoped project by name; a project with no active cards has all zeros.
          items:
            type: object
            required: [id, name, done, inProgress, notStarted, overdue, total]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
              done: { type: integer }
              inProgress: { type: integer }
              notStarted: { type: integer }
              overdue: { type: integer }
              total: { type: integer }
        workload:
          type: array
          description: Every member of the scoped projects with their open cards, most open first, then by name. Members with no open cards are included.
          items:
            type: object
            required: [user, inProgress, notStarted, overdue, open]
            properties:
              user: { $ref: '#/components/schemas/User' }
              inProgress: { type: integer }
              notStarted: { type: integer }
              overdue: { type: integer }
              open: { type: integer }
        byPriority:
          type: array
          description: Open cards per priority; all four are always present, urgent first.
          items:
            type: object
            required: [priority, open]
            properties:
              priority: { $ref: '#/components/schemas/Priority' }
              open: { type: integer }
        deadlines:
          type: array
          description: Open cards that are overdue or due within 14 days, soonest first, at most 20.
          items:
            type: object
            required: [cardId, projectId, projectName, listName, title, dueDate, daysLeft, assignees]
            properties:
              cardId: { type: integer, format: int64 }
              projectId: { type: integer, format: int64 }
              projectName: { type: string }
              listName: { type: string }
              title: { type: string }
              dueDate: { type: string, format: date }
              daysLeft: { type: integer, description: Days from today to dueDate; negative when overdue. }
              assignees: { type: array, items: { $ref: '#/components/schemas/User' } }
    Team:
      type: object
      required: [asOf, people, catalog, categories]
      properties:
        asOf: { type: string, format: date, description: Today in Asia/Bangkok. }
        people:
          type: array
          items: { $ref: '#/components/schemas/TeamPerson' }
        catalog:
          type: array
          description: Skills the department has named or put in a category, including ones nobody lists yet, by name ignoring case. A skill only on people's cards and never categorised is not listed (it is uncategorised).
          items:
            type: object
            required: [name, categoryId]
            properties:
              name: { type: string }
              categoryId: { type: [integer, 'null'], format: int64 }
        categories:
          type: array
          description: In the order they were made.
          items: { $ref: '#/components/schemas/SkillCategory' }
    SkillCategory:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    CategoryName:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 40 }
    TeamPerson:
      type: object
      required: [userId, name, avatarUrl, skills, open, overdue, dueSoon]
      properties:
        userId: { type: integer, format: int64 }
        name: { type: string }
        avatarUrl: { type: string }
        skills: { type: array, items: { type: string }, description: In the order saved. }
        open: { type: integer, minimum: 0 }
        overdue: { type: integer, minimum: 0 }
        dueSoon: { type: integer, minimum: 0 }
    MyTasks:
      type: object
      required: [asOf, tasks]
      properties:
        asOf: { type: string, format: date, description: Today in Asia/Bangkok. }
        tasks:
          type: array
          items: { $ref: '#/components/schemas/Task' }
    Task:
      type: object
      description: One open card assigned to a person.
      required: [cardId, projectId, projectName, listName, title, priority, startDate, dueDate, daysLeft, checklistTotal, checklistDone, assignees]
      properties:
        cardId: { type: integer, format: int64 }
        projectId: { type: integer, format: int64 }
        projectName: { type: string }
        listName: { type: string }
        title: { type: string }
        priority: { $ref: '#/components/schemas/Priority' }
        startDate: { type: [string, 'null'], format: date }
        dueDate: { type: [string, 'null'], format: date }
        daysLeft: { type: [integer, 'null'], description: Days from today to dueDate; negative when overdue; null without a dueDate. }
        checklistTotal: { type: integer }
        checklistDone: { type: integer }
        assignees: { type: array, description: Everyone on the card, the person included, by user id., items: { $ref: '#/components/schemas/User' } }
    PersonPage:
      type: object
      required: [asOf, person, projects, tasks]
      properties:
        asOf: { type: string, format: date, description: Today in Asia/Bangkok. }
        person: { $ref: '#/components/schemas/TeamPerson' }
        projects:
          type: array
          description: Live projects the person belongs to, by name, including ones the caller is not in.
          items:
            type: object
            required: [id, name, status, role, open]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
              status: { $ref: '#/components/schemas/ProjectStatus' }
              role: { $ref: '#/components/schemas/ProjectRole' }
              open: { type: integer, minimum: 0, description: Open cards of this project assigned to the person. }
        tasks:
          type: array
          description: Every open card assigned to the person in those projects, earliest due date first.
          items: { $ref: '#/components/schemas/Task' }
    ReportTemplate:
      type: object
      description: A department-wide report template. The storage key is never sent.
      required: [id, category, name, description, filename, mimeType, sizeBytes, uploadedBy, uploadedByName, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        category: { type: string }
        name: { type: string }
        description: { type: string }
        filename: { type: string }
        mimeType:
          type: string
          enum:
            - application/pdf
            - application/vnd.openxmlformats-officedocument.wordprocessingml.document
            - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
            - application/vnd.openxmlformats-officedocument.presentationml.presentation
        sizeBytes: { type: integer, format: int64 }
        uploadedBy: { type: integer, format: int64 }
        uploadedByName: { type: string, description: Display name from the user cache; empty when the uploader is not cached. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReportTemplatePatch:
      type: object
      additionalProperties: false
      properties:
        category: { type: string, maxLength: 60 }
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 500 }
    Document:
      type: object
      description: A project report. The storage key is never sent.
      required: [id, projectId, filename, mimeType, sizeBytes, uploadedBy, uploadedByName, createdAt]
      properties:
        id: { type: integer, format: int64 }
        projectId: { type: integer, format: int64 }
        filename: { type: string }
        mimeType: { type: string, const: application/pdf }
        sizeBytes: { type: integer, format: int64 }
        uploadedBy: { type: integer, format: int64 }
        uploadedByName: { type: string, description: Display name from the user cache; empty when the uploader is not cached. }
        createdAt: { type: string, format: date-time }
    Folder:
      type: object
      description: A project's report folder as the caller sees it.
      required: [id, name, archivedAt, documentCount, access, canUpload, canShare, canManage]
      properties:
        id: { type: integer, format: int64, description: The project id. }
        name: { type: string }
        archivedAt: { type: [string, 'null'], format: date-time }
        documentCount: { type: integer, description: Reports not deleted. }
        access: { type: string, enum: [admin, pm, member, shared], description: "The caller's project role, or shared when they are outside the project and the folder is shared with them." }
        canUpload: { type: boolean, description: False in an archived project. }
        canShare: { type: boolean, description: Admin, pm or member, in a live project. }
        canManage: { type: boolean, description: "Delete anyone's report (admin or pm); whoever can upload deletes their own." }
    FolderShare:
      type: object
      required: [userId, name, avatarUrl, sharedBy, createdAt]
      properties:
        userId: { type: integer, format: int64 }
        name: { type: string, description: Empty when user-service does not know the user any more. }
        avatarUrl: { type: string }
        sharedBy: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
    CommentInput:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 5000 }
    Comment:
      type: object
      required: [id, cardId, authorId, bodyMd, createdAt, editedAt, mentionIds]
      properties:
        id: { type: integer, format: int64 }
        cardId: { type: integer, format: int64 }
        authorId: { type: integer, format: int64 }
        bodyMd: { type: string }
        createdAt: { type: string, format: date-time }
        editedAt: { type: [string, 'null'], format: date-time }
        mentionIds: { type: array, items: { type: integer, format: int64 } }
