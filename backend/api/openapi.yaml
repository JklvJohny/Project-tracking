openapi: 3.1.0
info:
  title: Project Tracking service
  version: 1.0.0
  description: |
    Boards, lists, cards, checklists, comments, labels and members for one department.
    Every JSON response uses an envelope: `{ "success": true, "data": ... }` on success and
    `{ "success": false, "error": "<english text>", "code": "<code>", "fields"?: { "<field>": "<code>" } }`
    on failure. `error` is for logs; clients show their own Thai/English text chosen by `code`.
    The server never sends 405: a wrong method answers 400 `bad_request`.
    Writes are all-or-nothing and return the updated entity. Ids are int64 (JSON numbers).
    Dates are `YYYY-MM-DD`, timestamps are RFC 3339 in UTC (`...Z`).
    An archived project is read-only: every write to it or to anything in it answers 409 with
    error `project_archived`, except `POST /projects/{projectID}/restore`. An archived list is
    read-only too, with the cards in it (409).
    A JSON request body must be sent as `Content-Type: application/json` (otherwise 400). A write a
    browser marks `Sec-Fetch-Site: cross-site` answers 403 `forbidden`.
    Free text may not contain a NUL character or invalid UTF-8 (`fields.<field>=invalid`).
servers:
  - url: /api/tracking/v1
security:
  - userHeader: []
tags:
  - name: me
  - name: projects
  - name: members
  - name: labels
  - name: board
  - name: lists
  - name: cards
  - name: checklist
  - name: comments
  - name: documents
  - name: dashboard
  - name: team
  - name: profile
  - name: ops
paths:
  /healthz:
    servers:
      - url: /
    get:
      tags: [ops]
      operationId: healthz
      summary: Liveness probe (no auth, outside the API base path)
      security: []
      responses:
        '200': { $ref: '#/components/responses/Health' }
  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: The caller, with system-level capabilities
      responses:
        '200': { $ref: '#/components/responses/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/tasks:
    get:
      tags: [me]
      operationId: getMyTasks
      summary: The caller's open cards (completedAt not set) across the non-archived projects they can see. Active cards in active lists only. Earliest dueDate first, cards without a dueDate last. Today is the Asia/Bangkok date.
      responses:
        '200': { $ref: '#/components/responses/MyTasks' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/avatar:
    put:
      tags: [profile]
      operationId: setMyAvatar
      summary: Upload the caller's profile picture (multipart field `file`). JPEG, PNG or WebP up to 5 MiB and 40 megapixels; anything else is `file` = `unsupported_type` / `too_large` / `required`. The server crops it to the centre square and stores a 256x256 JPEG redrawn from the pixels (EXIF and other embedded data are dropped). Every tracking view then carries the new avatarUrl in place of the user-service one.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { $ref: '#/components/responses/AvatarUrl' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [profile]
      operationId: deleteMyAvatar
      summary: Remove the caller's tracking picture; the user-service avatar (returned, possibly empty) shows again.
      responses:
        '200': { $ref: '#/components/responses/AvatarUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{userID}/avatar:
    parameters:
      - $ref: '#/components/parameters/userID'
    get:
      tags: [profile]
      operationId: getAvatar
      summary: A tracking profile picture as image/jpeg, for any signed-in user. The URL in avatarUrl carries ?v=<version>, so responses are cacheable for good (private).
      parameters:
        - name: v
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: The picture.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /people/{userID}:
    parameters:
      - $ref: '#/components/parameters/userID'
    get:
      tags: [team]
      operationId: getPerson
      summary: One person's page. Admins and anyone who is PM of a project may open anyone's, and see every live project and open card of that person, also in projects they are not in; everyone else only their own (403). Counts follow GET /team.
      responses:
        '200': { $ref: '#/components/responses/Person' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /team:
    get:
      tags: [team]
      operationId: getTeam
      summary: Everyone in the department (from user-service) by name, with their skills and open-work counts across every live project (counts only, so projects the caller cannot see are not revealed). Open = assigned, not completed, in an active list of a non-archived project; overdue = dueDate before today; dueSoon = dueDate from today to 6 days ahead. Today is the Asia/Bangkok date.
      responses:
        '200': { $ref: '#/components/responses/Team' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /team/skills:
    post:
      tags: [team]
      operationId: addSkill
      summary: Name a skill for the department (the Team page offers and filters on it even before anyone has it) and optionally give it to people, in one transaction. A name that exists ignoring case is reused with its first spelling; people who already have it are left alone. At most 500 named skills (fields.name=too_many) and 500 people per request (fields.userIds=too_many). Anyone signed in. Returns the Team view.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 40, description: Trimmed with inner spaces squeezed; required. }
                userIds: { type: array, items: { type: integer, format: int64 }, description: People to give it to. Unknown ids are fields.userIds=unknown; anyone already at 30 skills is fields.userIds=too_many. }
                categoryId: { type: [integer, 'null'], format: int64, description: Category to put it in (an existing skill moves there). Unknown is fields.categoryId=unknown. }
      responses:
        '200': { $ref: '#/components/responses/Team' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [team]
      operationId: removeSkill
      summary: Take a skill off the department list (matched ignoring case). People who list it keep it. The name is a query parameter because skills such as CI/CD contain a slash.
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /team/skills/category:
    put:
      tags: [team]
      operationId: setSkillCategory
      summary: Put a skill (matched ignoring case) in one category, or none with categoryId null. A skill only on people's cards joins the department list under its first spelling. Anyone signed in. Returns the Team view.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, categoryId]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 40 }
                categoryId: { type: [integer, 'null'], format: int64, description: Unknown is fields.categoryId=unknown. }
      responses:
        '200': { $ref: '#/components/responses/Team' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /team/categories:
    post:
      tags: [team]
      operationId: createSkillCategory
      summary: Add a skill category. Names are trimmed with inner spaces squeezed, at most 40 characters, unique ignoring case (fields.name=exists); at most 50 categories (fields.name=too_many). Anyone signed in. Returns the Team view.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryName' }
      responses:
        '200': { $ref: '#/components/responses/Team' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /team/categories/{categoryID}:
    parameters:
      - name: categoryID
        in: path
        required: true
        schema: { type: integer, format: int64 }
    patch:
      tags: [team]
      operationId: renameSkillCategory
      summary: Rename a skill category, with the same rules as create; changing only the case is allowed. Returns the Team view.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryName' }
      responses:
        '200': { $ref: '#/components/responses/Team' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [team]
      operationId: deleteSkillCategory
      summary: Delete a skill category. Its skills stay, uncategorised. Returns the Team view.
      responses:
        '200': { $ref: '#/components/responses/Team' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /team/{userID}/skills:
    parameters:
      - $ref: '#/components/parameters/userID'
    put:
      tags: [team]
      operationId: setSkills
      summary: Replace a person's skills. Any signed-in user may edit anyone's. Each tag is trimmed with inner spaces squeezed; blanks are dropped and case-insensitive duplicates keep the first spelling. At most 30 tags of 40 characters; an empty list clears them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skills]
              additionalProperties: false
              properties:
                skills: { type: array, maxItems: 30, items: { type: string, maxLength: 40 } }
      responses:
        '200': { $ref: '#/components/responses/Skills' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /users:
    get:
      tags: [me]
      operationId: searchUsers
      summary: Search people for the member picker (empty q gives an empty list; max 20 results)
      parameters:
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/UserList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: Projects visible to the caller (admins see all; others only memberships). Active first, then newest change.
      responses:
        '200': { $ref: '#/components/responses/ProjectList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [projects]
      operationId: createProject
      summary: Create a project with its board and four default lists; the caller becomes its PM. Admin or manager only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectInput' }
      responses:
        '201': { $ref: '#/components/responses/Project' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /projects/{projectID}:
    parameters:
      - $ref: '#/components/parameters/projectID'
    get:
      tags: [projects]
      operationId: getProject
      responses:
        '200': { $ref: '#/components/responses/Project' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [projects]
      operationId: updateProject
      summary: Partial update. Omitted fields stay; null clears startDate or endDate (an empty string also clears, kept for older clients). PM or admin. 409 "project_archived" on an archived project.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProjectInput' }
      responses:
        '200': { $ref: '#/components/responses/Project' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /projects/{projectID}/archive:
    parameters:
      - $ref: '#/components/parameters/projectID'
    post:
      tags: [projects]
      operationId: archiveProject
      summary: Set archivedAt. PM or admin. Idempotent.
      responses:
        '200': { $ref: '#/components/responses/Project' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{projectID}/restore:
    parameters:
      - $ref: '#/components/parameters/projectID'
    post:
      tags: [projects]
      operationId: restoreProject
      summary: Clear archivedAt. 409 "name_in_use" when another live project already uses the name. PM or admin.
      responses:
        '200': { $ref: '#/components/responses/Project' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /projects/{projectID}/members:
    parameters:
      - $ref: '#/components/parameters/projectID'
    get:
      tags: [members]
      operationId: listMembers
      responses:
        '200': { $ref: '#/components/responses/MemberList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [members]
      operationId: addMember
      summary: Add a user-service user to the project. 404 when the user does not exist, 409 with error "already_member" when already a member. PM or admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddMemberInput' }
      responses:
        '201': { $ref: '#/components/responses/Member' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /projects/{projectID}/members/{userID}:
    parameters:
      - $ref: '#/components/parameters/projectID'
      - $ref: '#/components/parameters/userID'
    patch:
      tags: [members]
      operationId: setMemberRole
      summary: Change a role. Demoting the only PM answers 409 with error "last_pm". PM or admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetRoleInput' }
      responses:
        '200': { $ref: '#/components/responses/Member' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [members]
      operationId: removeMember
      summary: Remove a member. Removing the only PM answers 409 with error "last_pm". PM or admin.
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /projects/{projectID}/labels:
    parameters:
      - $ref: '#/components/parameters/projectID'
    get:
      tags: [labels]
      operationId: listLabels
      responses:
        '200': { $ref: '#/components/responses/LabelList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [labels]
      operationId: createLabel
      summary: Create a label (names are unique per project, ignoring case; a duplicate answers 409 "label_name_in_use"). PM or admin; 409 on an archived project.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LabelInput' }
      responses:
        '201': { $ref: '#/components/responses/Label' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /labels/{labelID}:
    parameters:
      - $ref: '#/components/parameters/labelID'
    patch:
      tags: [labels]
      operationId: updateLabel
      summary: Partial update of name and/or color. PM or admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LabelPatch' }
      responses:
        '200': { $ref: '#/components/responses/Label' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [labels]
      operationId: deleteLabel
      summary: Delete the label and remove it from every card. PM or admin.
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /projects/{projectID}/board:
    parameters:
      - $ref: '#/components/parameters/projectID'
    get:
      tags: [board]
      operationId: getBoard
      summary: Everything the board screen shows in one response (no description fields). Carries a weak ETag; send it back as If-None-Match to get 304 with no body.
      parameters:
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        '200':
          description: The board.
          headers:
            ETag:
              description: Weak validator built from the board's updatedAt and the caller's role.
              schema: { type: string }
            Cache-Control:
              description: private, no-cache
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data: { $ref: '#/components/schemas/Board' }
        '304':
          description: Not modified; empty body.
          headers:
            ETag:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{projectID}/archived:
    parameters:
      - $ref: '#/components/parameters/projectID'
    get:
      tags: [board]
      operationId: getArchived
      summary: Archived lists and archived cards of the board
      responses:
        '200': { $ref: '#/components/responses/Archived' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{projectID}/lists:
    parameters:
      - $ref: '#/components/parameters/projectID'
    post:
      tags: [lists]
      operationId: createList
      summary: Append a list at the end of the board. PM or admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateListInput' }
      responses:
        '201': { $ref: '#/components/responses/List' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /lists/{listID}:
    parameters:
      - $ref: '#/components/parameters/listID'
    patch:
      tags: [lists]
      operationId: updateList
      summary: Rename a list and/or set isDone. Setting isDone stamps completedAt on its active cards, clearing it unstamps them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateListInput' }
      responses:
        '200': { $ref: '#/components/responses/List' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /lists/{listID}/move:
    parameters:
      - $ref: '#/components/parameters/listID'
    post:
      tags: [lists]
      operationId: moveList
      summary: Drop a list between two neighbours. Stale or misordered neighbours answer 409 with error "stale_order"; the client refetches the board.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoveInput' }
      responses:
        '200': { $ref: '#/components/responses/List' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /lists/{listID}/archive:
    parameters:
      - $ref: '#/components/parameters/listID'
    post:
      tags: [lists]
      operationId: archiveList
      summary: Archive a list (its cards leave the board with it). PM or admin.
      responses:
        '200': { $ref: '#/components/responses/List' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /lists/{listID}/restore:
    parameters:
      - $ref: '#/components/parameters/listID'
    post:
      tags: [lists]
      operationId: restoreList
      summary: Restore a list to the end of the board. PM or admin.
      responses:
        '200': { $ref: '#/components/responses/List' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /lists/{listID}/cards:
    parameters:
      - $ref: '#/components/parameters/listID'
    post:
      tags: [cards]
      operationId: createCard
      summary: Create a card at the end of a list. Member, PM or admin. 409 for an archived list or project.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCardInput' }
      responses:
        '201': { $ref: '#/components/responses/Card' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /cards/{cardID}:
    parameters:
      - $ref: '#/components/parameters/cardID'
    get:
      tags: [cards]
      operationId: getCard
      summary: Full card detail. Comments are served separately.
      responses:
        '200': { $ref: '#/components/responses/Card' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [cards]
      operationId: updateCard
      summary: Partial update. An absent key leaves the field alone; startDate/dueDate null clears the date. Member, PM or admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCardInput' }
      responses:
        '200': { $ref: '#/components/responses/Card' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /cards/{cardID}/move:
    parameters:
      - $ref: '#/components/parameters/cardID'
    post:
      tags: [cards]
      operationId: moveCard
      summary: Move within or across lists of the same project. Moving into a done list stamps completedAt, out of one clears it. Stale neighbours answer 409 "stale_order".
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoveCardInput' }
      responses:
        '200': { $ref: '#/components/responses/Card' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /cards/{cardID}/archive:
    parameters:
      - $ref: '#/components/parameters/cardID'
    post:
      tags: [cards]
      operationId: archiveCard
      responses:
        '200': { $ref: '#/components/responses/Card' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /cards/{cardID}/restore:
    parameters:
      - $ref: '#/components/parameters/cardID'
    post:
      tags: [cards]
      operationId: restoreCard
      summary: Put the card back at the end of its list. 409 when the list is archived.
      responses:
        '200': { $ref: '#/components/responses/Card' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /cards/{cardID}/assignees/{userID}:
    parameters:
      - $ref: '#/components/parameters/cardID'
      - $ref: '#/components/parameters/userID'
    put:
      tags: [cards]
      operationId: assignUser
      summary: Assign a project member. Idempotent. 422 (userId not_member) for a non-member.
      responses:
        '200': { $ref: '#/components/responses/Card' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [cards]
      operationId: unassignUser
      summary: Remove an assignee. Idempotent.
      responses:
        '200': { $ref: '#/components/responses/Card' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /cards/{cardID}/labels/{labelID}:
    parameters:
      - $ref: '#/components/parameters/cardID'
      - $ref: '#/components/parameters/labelID'
    put:
      tags: [cards]
      operationId: addCardLabel
      summary: Put a label of the card's own project on the card. Idempotent.
      responses:
        '200': { $ref: '#/components/responses/Card' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [cards]
      operationId: removeCardLabel
      summary: Take a label off the card. Idempotent.
      responses:
        '200': { $ref: '#/components/responses/Card' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /cards/{cardID}/checklist:
    parameters:
      - $ref: '#/components/parameters/cardID'
    post:
      tags: [checklist]
      operationId: addChecklistItem
      summary: Append an item. 409 on an archived card. At most 100 items per card (fields.text=too_many).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddItemInput' }
      responses:
        '201': { $ref: '#/components/responses/ChecklistItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /checklist/{itemID}:
    parameters:
      - $ref: '#/components/parameters/itemID'
    patch:
      tags: [checklist]
      operationId: updateChecklistItem
      summary: Edit text and/or tick the item.
      description: >-
        Editing the text needs edit rights on the card (admin, pm, member). Ticking or unticking (`isDone`) is
        allowed for admin and pm on any card, and for a member only on cards assigned to them; otherwise 403
        forbidden.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemPatch' }
      responses:
        '200': { $ref: '#/components/responses/ChecklistItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [checklist]
      operationId: deleteChecklistItem
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /checklist/{itemID}/move:
    parameters:
      - $ref: '#/components/parameters/itemID'
    post:
      tags: [checklist]
      operationId: moveChecklistItem
      summary: Reorder within the card. Stale neighbours answer 409 "stale_order".
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MoveInput' }
      responses:
        '200': { $ref: '#/components/responses/ChecklistItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /cards/{cardID}/comments:
    parameters:
      - $ref: '#/components/parameters/cardID'
    get:
      tags: [comments]
      operationId: listComments
      summary: Non-deleted comments, oldest first
      responses:
        '200': { $ref: '#/components/responses/CommentList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [comments]
      operationId: addComment
      summary: Add a comment. Mentions are written `@[<userId>]` in the body; mentioned project members are notified.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentInput' }
      responses:
        '201': { $ref: '#/components/responses/Comment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /comments/{commentID}:
    parameters:
      - $ref: '#/components/parameters/commentID'
    patch:
      tags: [comments]
      operationId: editComment
      summary: Edit your own comment (sets editedAt).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommentInput' }
      responses:
        '200': { $ref: '#/components/responses/Comment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [comments]
      operationId: deleteComment
      summary: Soft-delete. Authors delete their own; PM or admin delete any.
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /projects/{projectID}/documents:
    parameters:
      - $ref: '#/components/parameters/projectID'
    get:
      tags: [documents]
      operationId: listDocuments
      summary: The project's non-deleted reports, newest first. Any member or admin; others get 404.
      responses:
        '200': { $ref: '#/components/responses/DocumentList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [documents]
      operationId: uploadDocument
      summary: Upload a PDF (admin, pm, member, or someone the folder is shared with). Max 20 MiB, and the content must start with `%PDF-` whatever the client claims. Field `file`; extra parts are ignored.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: The PDF. The file name is cleaned (no path parts or control characters, at most 200 characters). }
      responses:
        '201': { $ref: '#/components/responses/Document' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /documents/{documentID}/file:
    parameters:
      - $ref: '#/components/parameters/documentID'
    get:
      tags: [documents]
      operationId: downloadDocument
      summary: Stream the PDF through an authorised route (any member or admin). A deleted document is 404.
      responses:
        '200': { $ref: '#/components/responses/DocumentFile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /documents/{documentID}:
    parameters:
      - $ref: '#/components/parameters/documentID'
    delete:
      tags: [documents]
      operationId: deleteDocument
      summary: Soft-delete (the file is kept so restore works). The uploader, a pm or an admin; another member gets 403.
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /documents/{documentID}/restore:
    parameters:
      - $ref: '#/components/parameters/documentID'
    post:
      tags: [documents]
      operationId: restoreDocument
      summary: Undo a delete. Same permission as delete; restoring a live document is a no-op.
      responses:
        '200': { $ref: '#/components/responses/Document' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /report-folders:
    get:
      tags: [documents]
      operationId: listReportFolders
      summary: "The report folders the caller may open, by project id: every project's for an admin; otherwise the caller's projects and the folders shared with them."
      responses:
        '200': { $ref: '#/components/responses/FolderList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /projects/{projectID}/folder-shares:
    parameters:
      - $ref: '#/components/parameters/projectID'
    get:
      tags: [documents]
      operationId: listFolderShares
      summary: Who outside the project the report folder is shared with, oldest first. Admin, pm or member; a shared user gets 403, anyone else 404.
      responses:
        '200': { $ref: '#/components/responses/FolderShareList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{projectID}/folder-shares/{userID}:
    parameters:
      - $ref: '#/components/parameters/projectID'
      - $ref: '#/components/parameters/userID'
    put:
      tags: [documents]
      operationId: shareFolder
      summary: "Share the report folder with someone outside the project: they may list, download and upload reports and delete their own, nothing else in the project. Admin, pm or member. Sharing again returns the existing share. A project member is 422 (userId: already_member); an unknown user is 404; an archived project is 409."
      responses:
        '200': { $ref: '#/components/responses/FolderShare' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [documents]
      operationId: unshareFolder
      summary: Stop sharing the folder with that user (their uploads stay). Same permission as sharing; removing a share that does not exist is a no-op.
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /report-templates:
    get:
      tags: [templates]
      operationId: listReportTemplates
      summary: Every non-deleted report template, ordered by category, then name (case-insensitive). Templates are department-wide, not per project; any signed-in user may read them.
      responses:
        '200': { $ref: '#/components/responses/ReportTemplateList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [templates]
      operationId: uploadReportTemplate
      summary: Upload a template (any signed-in user). `.docx`, `.xlsx`, `.pptx`, the legacy `.doc`, `.xls`, `.ppt`, or `.pdf`, max 20 MiB; the content must match the extension (`PK` zip header for Office, the OLE2 header `D0 CF 11 E0` for legacy Office, `%PDF-` for PDF), else `file` = `unsupported_type`. Send the text fields BEFORE `file`; parts after the file are not read. An empty `name` defaults to the file name without its extension.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [category, file]
              properties:
                category: { type: string, maxLength: 60, description: Free text; the UI groups by it. Trimmed; required. }
                name: { type: string, maxLength: 120 }
                description: { type: string, maxLength: 500 }
                file: { type: string, format: binary }
      responses:
        '201': { $ref: '#/components/responses/ReportTemplate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
  /report-templates/{templateID}:
    parameters:
      - $ref: '#/components/parameters/templateID'
    patch:
      tags: [templates]
      operationId: updateReportTemplate
      summary: Edit category, name or description (any signed-in user). The file is not replaceable here; upload a new template instead. Same rules as upload; a deleted template is 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportTemplatePatch' }
      responses:
        '200': { $ref: '#/components/responses/ReportTemplate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [templates]
      operationId: deleteReportTemplate
      summary: Soft-delete (any signed-in user); the file is kept so restore works.
      responses:
        '200': { $ref: '#/components/responses/Empty' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /report-templates/{templateID}/file:
    parameters:
      - $ref: '#/components/parameters/templateID'
    get:
      tags: [templates]
      operationId: downloadReportTemplate
      summary: Stream the file as an attachment with its own MIME type. A deleted template is 404.
      responses:
        '200': { $ref: '#/components/responses/ReportTemplateFile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /report-templates/{templateID}/restore:
    parameters:
      - $ref: '#/components/parameters/templateID'
    post:
      tags: [templates]
      operationId: restoreReportTemplate
      summary: Undo a delete (any signed-in user); restoring a live template is a no-op.
      responses:
        '200': { $ref: '#/components/responses/ReportTemplate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /dashboard:
    get:
      tags: [dashboard]
      operationId: getDashboard
      summary: Open-work overview across the projects the caller can see (an admin sees all non-archived projects). Counts only active cards in active lists of non-archived projects. `projectId` narrows it to one project; a project the caller cannot see, or an archived one, is 404. Today is the Asia/Bangkok date.
      parameters:
        - { name: projectId, in: query, required: false, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        '200': { $ref: '#/components/responses/Dashboard' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    userHeader:
      type: apiKey
      in: header
      name: X-User-ID
      description: Local development only (build tag `local`). Production authentication replaces it.
  parameters:
    projectID: { name: projectID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    userID: { name: userID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    listID: { name: listID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    cardID: { name: cardID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    labelID: { name: labelID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    itemID: { name: itemID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    commentID: { name: commentID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    documentID: { name: documentID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    templateID: { name: templateID, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
  responses:
    Health:
      description: Service is up.
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success: { const: true }
              data: { type: object, required: [status], properties: { status: { const: ok } } }
    Me:
      description: The caller.
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
              success: { const: true }
              data: { $ref: '#/components/schemas/Me' }
    UserList:
      description: Matching users.
      content:
        application/json:
          schema:
            type: object
            required: [success, data]
            properties:
