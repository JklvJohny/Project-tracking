<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Milestones mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Design mockup for project milestones. Same tokens as the app (shadcn neutral). Not app code. */
:root {
  --bg: oklch(1 0 0); --fg: oklch(0.145 0 0); --card: oklch(1 0 0); --muted: oklch(0.97 0 0);
  --muted-fg: oklch(0.48 0 0); --border: oklch(0.922 0 0); --accent: oklch(0.97 0 0);
  --primary: oklch(0.205 0 0); --primary-fg: oklch(0.985 0 0); --ring: oklch(0.708 0 0);
  --overlay: oklch(0 0 0 / 0.35);
  --done: oklch(0.6 0.13 155); --done-bg: oklch(0.95 0.05 155); --done-fg: oklch(0.38 0.1 155);
  --track: oklch(0.55 0.17 255); --track-bg: oklch(0.95 0.03 255); --track-fg: oklch(0.4 0.15 255);
  --risk: oklch(0.75 0.15 75); --risk-bg: oklch(0.96 0.06 85); --risk-fg: oklch(0.45 0.1 65);
  --late: oklch(0.6 0.2 25); --late-bg: oklch(0.95 0.04 25); --late-fg: oklch(0.45 0.17 25);
  --todo: oklch(0.8 0 0);
  --p-low: oklch(0.55 0.02 260); --p-medium: oklch(0.55 0.17 255); --p-high: oklch(0.6 0.15 50); --p-urgent: oklch(0.55 0.2 25);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: oklch(0.145 0 0); --fg: oklch(0.985 0 0); --card: oklch(0.205 0 0); --muted: oklch(0.269 0 0);
    --muted-fg: oklch(0.72 0 0); --border: oklch(1 0 0 / 10%); --accent: oklch(0.269 0 0);
    --primary: oklch(0.922 0 0); --primary-fg: oklch(0.205 0 0); --ring: oklch(0.556 0 0);
    --overlay: oklch(0 0 0 / 0.6);
    --done-bg: oklch(0.6 0.13 155 / 0.16); --done-fg: oklch(0.85 0.1 155);
    --track-bg: oklch(0.55 0.17 255 / 0.18); --track-fg: oklch(0.82 0.1 255);
    --risk-bg: oklch(0.75 0.15 75 / 0.16); --risk-fg: oklch(0.88 0.12 85);
    --late-bg: oklch(0.6 0.2 25 / 0.18); --late-fg: oklch(0.82 0.12 25);
    --todo: oklch(0.4 0 0);
  }
}
:root[data-theme="dark"] {
  --bg: oklch(0.145 0 0); --fg: oklch(0.985 0 0); --card: oklch(0.205 0 0); --muted: oklch(0.269 0 0);
  --muted-fg: oklch(0.72 0 0); --border: oklch(1 0 0 / 10%); --accent: oklch(0.269 0 0);
  --primary: oklch(0.922 0 0); --primary-fg: oklch(0.205 0 0); --ring: oklch(0.556 0 0);
  --overlay: oklch(0 0 0 / 0.6);
  --done-bg: oklch(0.6 0.13 155 / 0.16); --done-fg: oklch(0.85 0.1 155);
  --track-bg: oklch(0.55 0.17 255 / 0.18); --track-fg: oklch(0.82 0.1 255);
  --risk-bg: oklch(0.75 0.15 75 / 0.16); --risk-fg: oklch(0.88 0.12 85);
  --late-bg: oklch(0.6 0.2 25 / 0.18); --late-fg: oklch(0.82 0.12 25);
  --todo: oklch(0.4 0 0);
}
* { box-sizing: border-box; }
html { color-scheme: light dark; }
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 "Noto Sans Thai", system-ui, sans-serif; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 20px 16px 48px; }
@media (min-width: 640px) { .wrap { padding: 24px 24px 64px; } }

/* header */
.crumbs { font-size: 13px; color: var(--muted-fg); display: flex; gap: 8px; align-items: center; }
.head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin: 10px 0 20px; }
.head h1 { margin: 0; font-size: 24px; font-weight: 600; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); cursor: pointer; font-size: 13px; font-weight: 500; }
.btn:hover { background: var(--accent); }
.btn.primary { background: var(--primary); color: var(--primary-fg); border-color: transparent; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.icon { width: 32px; padding: 0; justify-content: center; }
.btn svg, .ico { width: 16px; height: 16px; flex: none; }
.avatars { display: flex; }
.av { position: relative; width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: #fff; box-shadow: 0 0 0 2px var(--card); }
.avatars .av + .av { margin-left: -6px; }
.av.sm { width: 22px; height: 22px; font-size: 9px; }

/* milestone roadmap */
.panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; }
.roadmap { padding: 16px 16px 18px; margin-bottom: 20px; }
.roadmap-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.roadmap-head h2 { margin: 0; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.count { border-radius: 999px; background: var(--muted); color: var(--muted-fg); padding: 0 8px; font-size: 12px; font-weight: 500; }
.track-scroll { overflow-x: auto; position: relative; padding-bottom: 4px; scrollbar-width: thin; }
.track { position: relative; display: grid; grid-template-columns: repeat(var(--n), minmax(220px, 1fr)); gap: 12px; min-width: min-content; padding-top: 40px; }
.rail { position: absolute; left: 0; right: 0; top: 38px; height: 2px; background: var(--border); }
.rail-fill { position: absolute; left: 0; top: 38px; height: 2px; background: var(--done); }
/* A short tick through the rail only, so it never runs across a milestone card. */
.today { position: absolute; top: 0; height: 46px; width: 0; border-left: 2px dashed var(--late); pointer-events: none; z-index: 1; }
.today span { position: absolute; top: 0; left: -1px; transform: translateX(-50%); background: var(--late); color: #fff; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.ms { position: relative; text-align: left; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 22px 14px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; transition: border-color .15s, box-shadow .15s, transform .15s; }
.ms:hover { border-color: var(--ring); transform: translateY(-1px); box-shadow: 0 4px 14px oklch(0 0 0 / 0.08); }
.ms[aria-pressed="true"] { border-color: var(--fg); box-shadow: 0 0 0 1px var(--fg); }
.diamond { position: absolute; top: -9px; left: 14px; width: 16px; height: 16px; transform: rotate(45deg); border-radius: 3px; border: 2px solid var(--card); box-shadow: 0 0 0 1px var(--border); }
.ms-name { font-weight: 600; font-size: 15px; line-height: 1.3; }
.ms-date { font-size: 12px; color: var(--muted-fg); display: flex; gap: 6px; flex-wrap: wrap; }
.bar { height: 6px; border-radius: 999px; background: var(--muted); overflow: hidden; display: flex; }
.bar > span { display: block; height: 100%; }
.ms-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted-fg); }

/* filters + board */
.filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); cursor: pointer; font-size: 12.5px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--primary); color: var(--primary-fg); border-color: transparent; }
.chip .mini { width: 8px; height: 8px; transform: rotate(45deg); border-radius: 2px; }
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(270px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.col { background: color-mix(in oklch, var(--muted) 55%, transparent); border: 1px solid var(--border); border-radius: 12px; padding: 8px; align-self: start; }
.col-head { display: flex; justify-content: space-between; align-items: center; padding: 2px 6px 8px; font-weight: 600; font-size: 14px; }
.col ol { list-style: none; margin: 0; padding: 0; background: var(--card); border-radius: 10px; box-shadow: 0 0 0 1px var(--border); }
.col li + li { border-top: 1px solid var(--border); }
.bcard { padding: 12px 14px; transition: opacity .2s; }
.bcard.dim { opacity: .28; }
.prio { display: inline-block; border-radius: 4px; padding: 0 6px; font-size: 10px; line-height: 18px; font-weight: 700; color: #fff; text-transform: uppercase; letter-spacing: .02em; }
.mtag { display: inline-flex; align-items: center; gap: 5px; border-radius: 4px; padding: 0 6px; font-size: 11px; line-height: 18px; font-weight: 500; background: var(--muted); color: var(--fg); }
.mtag .mini { width: 7px; height: 7px; transform: rotate(45deg); border-radius: 1.5px; }
.bcard .title { margin: 6px 0 0; font-weight: 600; font-size: 14.5px; line-height: 1.35; }
.meta { margin-top: 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted-fg); }
.due { display: inline-flex; align-items: center; gap: 4px; border-radius: 4px; padding: 0 6px; line-height: 20px; }
.due.late { background: var(--late-bg); color: var(--late-fg); font-weight: 500; }
.due.ok { background: var(--done-bg); color: var(--done-fg); }

/* sheet */
.scrim { position: fixed; inset: 0; background: var(--overlay); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%); background: var(--card); border-left: 1px solid var(--border); transform: translateX(100%); transition: transform .25s ease; z-index: 21; display: flex; flex-direction: column; }
.sheet.open { transform: none; }
@media (prefers-reduced-motion: reduce) { .sheet, .scrim, .ms, .bcard { transition: none; } }
.sheet-top { display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 20px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--muted-fg); }
.sheet-top .sp { flex: 1; }
.sheet-body { overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
.sheet h2 { margin: 0; font-size: 22px; font-weight: 600; line-height: 1.25; display: flex; gap: 10px; align-items: center; }
.sheet h2 .diamond { position: static; flex: none; width: 14px; height: 14px; box-shadow: none; border: 0; }
.desc { margin: 0; color: var(--muted-fg); }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.fact { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.fact dt { font-size: 11.5px; color: var(--muted-fg); }
.fact dd { margin: 2px 0 0; font-weight: 600; display: flex; align-items: center; gap: 6px; }
@media (max-width: 520px) { .facts { grid-template-columns: 1fr 1fr; } }
.prog { display: grid; grid-template-columns: 96px 1fr; gap: 18px; align-items: center; }
.ring { width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; }
.ring > div { width: 74px; height: 74px; border-radius: 50%; background: var(--card); display: grid; place-items: center; text-align: center; line-height: 1.1; }
.ring b { font-size: 22px; }
.ring small { font-size: 11px; color: var(--muted-fg); }
.legend { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 14px; margin-top: 10px; font-size: 12.5px; }
.legend span { display: flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legend b { margin-left: auto; font-variant-numeric: tabular-nums; }
.sec-title { margin: 0 0 8px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.list { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.group { padding: 6px 12px; font-size: 12px; font-weight: 600; background: var(--muted); display: flex; gap: 6px; align-items: center; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 12px; border-top: 1px solid var(--border); }
.item .t { font-weight: 500; }
.item .s { font-size: 12px; color: var(--muted-fg); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.item .r { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.mini-gantt { border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: grid; gap: 6px; }
.g-row { display: grid; grid-template-columns: 140px 1fr; gap: 10px; align-items: center; font-size: 12px; }
.g-row .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted-fg); }
.g-lane { position: relative; height: 14px; background: var(--muted); border-radius: 4px; }
.g-lane .b { position: absolute; top: 2px; bottom: 2px; border-radius: 3px; }
.g-lane .end { position: absolute; top: -3px; bottom: -3px; border-left: 2px solid var(--fg); }
.g-lane .now { position: absolute; top: -3px; bottom: -3px; border-left: 2px dashed var(--late); }
.sheet-foot { border-top: 1px solid var(--border); padding: 12px 20px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; }
.toast.show { opacity: 1; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <nav class="crumbs" aria-label="ตำแหน่ง"><span>โปรเจกต์</span><span aria-hidden="true">/</span><span style="color:var(--fg);font-weight:500">Website Redesign</span></nav>
  <div class="head">
    <div class="row">
      <h1>Website Redesign</h1>
      <span class="pill" style="background:var(--done-bg);color:var(--done-fg)"><span class="dot"></span>กำลังดำเนินการ</span>
      <span class="avatars" id="team"></span>
    </div>
    <div class="row">
      <button class="btn" type="button" id="themeBtn" aria-label="สลับธีม">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        ธีม
      </button>
      <button class="btn" type="button">สมาชิก</button>
      <button class="btn" type="button">ตั้งค่า</button>
    </div>
  </div>

  <section class="panel roadmap" aria-labelledby="ms-h">
    <div class="roadmap-head">
      <h2 id="ms-h">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 22 12 12 22 2 12Z"/></svg>
        Milestones <span class="count" id="msCount"></span>
      </h2>
      <button class="btn" type="button" data-toast="เปิดฟอร์มสร้าง milestone (PM และ admin)">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        เพิ่ม milestone
      </button>
    </div>
    <div class="track-scroll">
      <div class="track" id="track"></div>
    </div>
  </section>

  <div class="filters" role="group" aria-label="กรองบอร์ดตาม milestone" id="filters"></div>
  <div class="board" id="board"></div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
  <div class="sheet-top">
    <span>Website Redesign</span><span aria-hidden="true">/</span><span>Milestones</span>
    <span class="sp"></span>
    <button class="btn ghost icon" type="button" id="prevMs" aria-label="milestone ก่อนหน้า"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
    <button class="btn ghost icon" type="button" id="nextMs" aria-label="milestone ถัดไป"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
    <button class="btn ghost icon" type="button" id="closeSheet" aria-label="ปิด"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
  <div class="sheet-foot">
    <button class="btn" type="button" id="filterFromSheet">แสดงเฉพาะการ์ดนี้บนบอร์ด</button>
    <button class="btn" type="button" data-toast="เปิดฟอร์มแก้ไข milestone">แก้ไข</button>
    <button class="btn primary" type="button" id="completeBtn">ทำเครื่องหมายว่าเสร็จ</button>
  </div>
</aside>
<div class="toast" role="status" id="toast"></div>

<script>

  { t: 'Set up image CDN', l: 'In Progress', m: 3, p: 'medium', a: ['wr'], s: '2026-11-14', d: '2026-11-19' },
  { t: 'Write API docs for /projects endpoints', l: 'To Do', m: 3, p: 'medium', a: ['wr', 'sp'], s: '2026-11-20', d: '2026-11-23' },
  { t: 'Staging environment', l: 'Backlog', m: 3, p: 'high', a: ['tt'], s: '2026-11-25', d: '2026-12-05', ck: [0, 4] },
  { t: 'Internal beta feedback form', l: 'Backlog', m: 3, p: 'low', a: [], s: '2026-12-01', d: '2026-12-12' },
  { t: 'Analytics dashboards', l: 'Backlog', m: 4, p: 'medium', a: ['sp'], s: '2026-12-16', d: '2026-12-30' },
  { t: 'SEO metadata pass', l: 'Backlog', m: 4, p: 'low', a: ['ms'], s: '2026-12-20', d: '2027-01-05' },
  { t: 'Launch checklist', l: 'Backlog', m: 4, p: 'urgent', a: ['nk'], s: null, d: '2027-01-08' },
  { t: 'Refactor footer links', l: 'Backlog', m: null, p: 'low', a: ['tt'], s: null, d: null },
];
CARDS.forEach((c, i) => { c.id = i + 1; });

const PRIO = { low: 'ต่ำ', medium: 'ปานกลาง', high: 'สูง', urgent: 'เร่งด่วน' };
const DATE = new Intl.DateTimeFormat('th-TH', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
const fmt = (iso) => DATE.format(new Date(iso));
const days = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

let filter = null; // milestone id shown on the board, or null for all
let openId = null;
let opener = null;

function cardState(c) {
  if (c.done) return 'done';
  if (c.d && c.d < TODAY) return 'late';
  if (c.s && c.s <= TODAY) return 'doing';
  return 'todo';
}

// Status rules: done when completed; overdue when the date passed with cards open;
// at risk when due within 7 days and under 80% done; otherwise on track.
function msStats(m) {
  const cards = CARDS.filter((c) => c.m === m.id);
  const n = { done: 0, doing: 0, todo: 0, late: 0 };
  cards.forEach((c) => n[cardState(c)]++);
  const pct = cards.length ? Math.round((n.done / cards.length) * 100) : 0;
  const left = days(TODAY, m.date);
  let status = 'track';
  if (m.completedAt) status = 'done';
  else if (left < 0) status = 'late';
  else if (left <= 7 && pct < 80) status = 'risk';
  return { cards, n, pct, left, status };
}
const STATUS = {
  done: { label: 'เสร็จแล้ว', v: 'done' },
  track: { label: 'ตามแผน', v: 'track' },
  risk: { label: 'เสี่ยงล่าช้า', v: 'risk' },
  late: { label: 'เลยกำหนด', v: 'late' },
};
const statusPill = (s) => `<span class="pill" style="background:var(--${STATUS[s].v}-bg);color:var(--${STATUS[s].v}-fg)"><span class="dot"></span>${STATUS[s].label}</span>`;
const diamondColor = (s) => (s === 'done' ? 'var(--done)' : s === 'late' ? 'var(--late)' : s === 'risk' ? 'var(--risk)' : 'var(--track)');
const leftText = (left, done) => (done ? 'ปิดแล้ว' : left < 0 ? `เลยมา ${-left} วัน` : left === 0 ? 'วันนี้' : `อีก ${left} วัน`);
const avatar = (k, cls = '') => `<span class="av ${cls}" style="background:${PEOPLE[k].c}" title="${esc(PEOPLE[k].name)}"><span aria-hidden="true">${PEOPLE[k].ini}</span><span class="sr">${esc(PEOPLE[k].name)}</span></span>`;
const segBar = (n, total) => total
  ? `<div class="bar" aria-hidden="true">${[['done', 'var(--done)'], ['doing', 'var(--track)'], ['late', 'var(--late)'], ['todo', 'var(--todo)']]
      .map(([k, c]) => `<span style="width:${(n[k] / total) * 100}%;background:${c}"></span>`).join('')}</div>`
  : '<div class="bar" aria-hidden="true"></div>';

function renderTeam() {
  document.getElementById('team').innerHTML = ['nk', 'wr', 'sp', 'pm', 'tt'].map((k) => avatar(k)).join('');
}

function renderRoadmap() {
  const track = document.getElementById('track');
  track.style.setProperty('--n', MILESTONES.length);
  document.getElementById('msCount').textContent = MILESTONES.length;
  const nodes = MILESTONES.map((m) => {
    const st = msStats(m);
    return `<button type="button" class="ms" data-ms="${m.id}" aria-pressed="${openId === m.id}"
        aria-label="${esc(m.name)}, ${STATUS[st.status].label}, ครบกำหนด ${fmt(m.date)}, เสร็จ ${st.n.done} จาก ${st.cards.length} การ์ด">
      <span class="diamond" style="background:${diamondColor(st.status)}" aria-hidden="true"></span>
      <span class="ms-name">${esc(m.name)}</span>
      <span class="ms-date"><span>${fmt(m.date)}</span><span aria-hidden="true">·</span><span>${leftText(st.left, st.status === 'done')}</span></span>
      ${segBar(st.n, st.cards.length)}
      <span class="ms-foot"><span>${st.n.done}/${st.cards.length} การ์ด · ${st.pct}%</span>${statusPill(st.status)}</span>
    </button>`;
  }).join('');
  track.innerHTML = `<div class="rail"></div><div class="rail-fill" id="railFill"></div><div class="today" id="today"><span>วันนี้</span></div>${nodes}`;
  placeToday();
}

// The rail is evenly spaced, so "today" sits between the two milestones around it, interpolated by date.
function placeToday() {
  const track = document.getElementById('track');
  const btns = [...track.querySelectorAll('.ms')];
  if (!btns.length) return;
  const x = (i) => btns[i].offsetLeft + 21; // the diamond's centre
  let px;
  const i = MILESTONES.findIndex((m) => m.date >= TODAY);
  if (i === -1) px = x(btns.length - 1) + 40;
  else if (i === 0) px = Math.max(4, x(0) - 30);
  else {
    const a = MILESTONES[i - 1], b = MILESTONES[i];
    px = x(i - 1) + (x(i) - x(i - 1)) * (days(a.date, TODAY) / days(a.date, b.date));
  }
  document.getElementById('today').style.left = `${px}px`;
  document.getElementById('railFill').style.width = `${px}px`;
}

function renderFilters() {
  const el = document.getElementById('filters');
  const chip = (id, label, color) => `<button type="button" class="chip" data-filter="${id ?? ''}" aria-pressed="${filter === id}">${color ? `<span class="mini" style="background:${color}" aria-hidden="true"></span>` : ''}${esc(label)}</button>`;
  el.innerHTML = chip(null, 'ทุก milestone') + MILESTONES.map((m) => chip(m.id, m.name, diamondColor(msStats(m).status))).join('')
    + chip(0, 'ไม่มี milestone');
}

function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = LISTS.map((l) => {
    const cards = CARDS.filter((c) => c.l === l);
    return `<section class="col" aria-label="${l}">
      <div class="col-head"><span>${l}</span><span class="count">${cards.length}</span></div>
      <ol>${cards.map((c) => {
        const m = MILESTONES.find((x) => x.id === c.m);
        const st = cardState(c);
        const dim = filter !== null && (filter === 0 ? c.m !== null : c.m !== filter);
        return `<li class="bcard ${dim ? 'dim' : ''}">
          <div class="row" style="gap:6px">
            <span class="prio" style="background:var(--p-${c.p})">${PRIO[c.p]}</span>
            ${m ? `<span class="mtag"><span class="mini" style="background:${diamondColor(msStats(m).status)}" aria-hidden="true"></span>${esc(m.name)}</span>` : ''}
          </div>
          <p class="title">${esc(c.t)}</p>
          <div class="meta">
            <span>${c.d ? `<span class="due ${st === 'late' ? 'late' : c.done ? 'ok' : ''}">${st === 'late' ? 'เลยกำหนด · ' : ''}${fmt(c.d)}</span>` : ''}${c.ck ? ` · ${c.ck[0]}/${c.ck[1]}` : ''}</span>
            <span class="avatars">${c.a.map((k) => avatar(k, 'sm')).join('')}</span>
          </div>
        </li>`;
      }).join('')}</ol>
    </section>`;
  }).join('');
}

function renderSheet() {
  const m = MILESTONES.find((x) => x.id === openId);
  if (!m) return;
  const st = msStats(m);
  const total = st.cards.length || 1;
  const ring = `conic-gradient(var(--done) 0 ${st.pct}%, var(--muted) ${st.pct}% 100%)`;
  const groups = [['late', 'เลยกำหนด', 'var(--late)'], ['doing', 'กำลังทำ', 'var(--track)'], ['todo', 'ยังไม่เริ่ม', 'var(--todo)'], ['done', 'เสร็จแล้ว', 'var(--done)']];
  const span = days(m.start, m.date) || 1;
  const pos = (iso) => Math.min(100, Math.max(0, (days(m.start, iso) / span) * 100));
  const nowIn = TODAY >= m.start && TODAY <= m.date;
  const late = st.n.late;
  document.getElementById('sheetBody').innerHTML = `
    <div>
      <div class="row" style="margin-bottom:8px">${statusPill(st.status)}<span style="font-size:12.5px;color:var(--muted-fg)">${fmt(m.start)} – ${fmt(m.date)}</span></div>
      <h2 id="sheetTitle"><span class="diamond" style="background:${diamondColor(st.status)}" aria-hidden="true"></span>${esc(m.name)}</h2>
      <p class="desc" style="margin-top:6px">${esc(m.desc)}</p>
    </div>

    <dl class="facts" style="margin:0">
      <div class="fact"><dt>ครบกำหนด</dt><dd>${fmt(m.date)}</dd></div>
      <div class="fact"><dt>เวลาที่เหลือ</dt><dd style="color:${st.status === 'late' ? 'var(--late-fg)' : 'inherit'}">${leftText(st.left, st.status === 'done')}</dd></div>
      <div class="fact"><dt>ผู้รับผิดชอบ</dt><dd>${avatar(m.owner, 'sm')}<span style="font-weight:500">${esc(PEOPLE[m.owner].name)}</span></dd></div>
    </dl>

    <div class="prog">
      <div class="ring" style="background:${ring}" role="img" aria-label="เสร็จ ${st.pct} เปอร์เซ็นต์"><div><b>${st.pct}%</b><small>เสร็จ</small></div></div>
      <div>
        ${segBar(st.n, st.cards.length)}
        <div class="legend">
          ${groups.map(([k, label, c]) => `<span><i style="background:${c}"></i>${label}<b>${st.n[k]}</b></span>`).join('')}
        </div>
      </div>
    </div>

    ${late ? `<div class="row" style="background:var(--late-bg);color:var(--late-fg);border-radius:10px;padding:10px 12px;font-size:13px">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
      มี ${late} การ์ดเลยกำหนด ซึ่งอาจทำให้ milestone นี้ล่าช้า</div>` : ''}

    <div>
      <h3 class="sec-title">ไทม์ไลน์ของการ์ด</h3>
      <div class="mini-gantt">
        ${st.cards.filter((c) => c.d).map((c) => {
          const s = cardState(c);
          const a = pos(c.s || c.d), b = pos(c.d);
          const col = s === 'done' ? 'var(--done)' : s === 'late' ? 'var(--late)' : s === 'doing' ? 'var(--track)' : 'var(--todo)';
          return `<div class="g-row"><span class="lbl" title="${esc(c.t)}">${esc(c.t)}</span>
            <div class="g-lane"><span class="b" style="left:${a}%;width:${Math.max(2, b - a)}%;background:${col}"></span>
            ${nowIn ? `<span class="now" style="left:${pos(TODAY)}%" aria-hidden="true"></span>` : ''}</div></div>`;
        }).join('')}
        <div class="g-row"><span></span><div style="position:relative;height:16px;font-size:11px;color:var(--muted-fg)">
          <span style="position:absolute;left:0">${fmt(m.start)}</span>
          ${nowIn && pos(TODAY) > 22 && pos(TODAY) < 78 ? `<span style="position:absolute;left:${pos(TODAY)}%;transform:translateX(-50%);color:var(--late-fg)">วันนี้</span>` : ''}
          <span style="position:absolute;right:0">${fmt(m.date)} ◆</span></div></div>
      </div>
    </div>

    <div>
      <h3 class="sec-title">การ์ดใน milestone <span class="count">${st.cards.length}</span></h3>
      <div class="list">
        ${groups.map(([k, label, c]) => {
          const rows = st.cards.filter((x) => cardState(x) === k);
          if (!rows.length) return '';
          return `<div class="group"><i style="width:8px;height:8px;border-radius:2px;background:${c}"></i>${label} (${rows.length})</div>
            ${rows.map((x) => `<div class="item">
              <div>
                <div class="t">${esc(x.t)}</div>
                <div class="s"><span class="prio" style="background:var(--p-${x.p})">${PRIO[x.p]}</span><span>${x.l}</span>${x.ck ? `<span>งานย่อย ${x.ck[0]}/${x.ck[1]}</span>` : ''}</div>
              </div>
              <div class="r">
                ${x.d ? `<span class="due ${k === 'late' ? 'late' : k === 'done' ? 'ok' : ''}" style="font-size:12px">${fmt(x.d)}</span>` : '<span style="font-size:12px;color:var(--muted-fg)">ไม่มีกำหนด</span>'}
                <span class="avatars">${x.a.length ? x.a.map((a) => avatar(a, 'sm')).join('') : '<span style="font-size:11px;color:var(--muted-fg)">ยังไม่มอบหมาย</span>'}</span>
              </div>
            </div>`).join('')}`;
        }).join('')}
      </div>
    </div>`;
  const done = st.status === 'done';
  const btn = document.getElementById('completeBtn');
  btn.textContent = done ? 'เปิด milestone อีกครั้ง' : 'ทำเครื่องหมายว่าเสร็จ';
  btn.className = done ? 'btn' : 'btn primary';
  document.getElementById('prevMs').disabled = MILESTONES[0].id === m.id;
  document.getElementById('nextMs').disabled = MILESTONES[MILESTONES.length - 1].id === m.id;
}

function openSheet(id, from) {
  openId = id;
  if (from) opener = from;
  renderSheet();
  renderRoadmap();
  const sheet = document.getElementById('sheet');
  sheet.classList.add('open');
  sheet.setAttribute('aria-hidden', 'false');
  document.getElementById('scrim').classList.add('open');
  document.getElementById('closeSheet').focus();
}
function closeSheet() {
  const id = openId;
  openId = null;
  const sheet = document.getElementById('sheet');
  sheet.classList.remove('open');
  sheet.setAttribute('aria-hidden', 'true');
  document.getElementById('scrim').classList.remove('open');
  renderRoadmap();
  document.querySelector(`.ms[data-ms="${id}"]`)?.focus();
}
function step(dir) {
  const i = MILESTONES.findIndex((m) => m.id === openId) + dir;
  if (MILESTONES[i]) { openId = MILESTONES[i].id; renderSheet(); renderRoadmap(); }
}

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

document.addEventListener('click', (e) => {
  const ms = e.target.closest('[data-ms]');
  if (ms) return openSheet(Number(ms.dataset.ms), ms);
  const f = e.target.closest('[data-filter]');
  if (f) {
    filter = f.dataset.filter === '' ? null : Number(f.dataset.filter);
    renderFilters(); renderBoard();
    return;
  }
  const tb = e.target.closest('[data-toast]');
  if (tb) toast(tb.dataset.toast);
});
document.getElementById('scrim').addEventListener('click', closeSheet);
document.getElementById('closeSheet').addEventListener('click', closeSheet);
document.getElementById('prevMs').addEventListener('click', () => step(-1));
document.getElementById('nextMs').addEventListener('click', () => step(1));
document.getElementById('filterFromSheet').addEventListener('click', () => {
  filter = openId; closeSheet(); renderFilters(); renderBoard();
  document.getElementById('filters').scrollIntoView({ behavior: 'smooth', block: 'start' });
});
document.getElementById('completeBtn').addEventListener('click', () => {
  const m = MILESTONES.find((x) => x.id === openId);
  m.completedAt = m.completedAt ? null : TODAY;
  toast(m.completedAt ? `ปิด "${m.name}" แล้ว` : `เปิด "${m.name}" อีกครั้ง`);
  renderSheet(); renderRoadmap(); renderFilters(); renderBoard();
});
document.getElementById('sheet').addEventListener('keydown', (e) => {
  if (e.key === 'Escape') return closeSheet();
  if (e.key !== 'Tab') return;
  // Keep Tab inside the open panel.
  const f = [...e.currentTarget.querySelectorAll('button:not([disabled])')];
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
document.getElementById('themeBtn').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
});
window.addEventListener('resize', placeToday);

renderTeam(); renderRoadmap(); renderFilters(); renderBoard();
</script>
</body>
</html>
