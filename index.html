<!--
  Project Tracking: interactive HTML/CSS design prototype for the /tracking route.
  Visual + behavior reference for the Next.js (App Router) + Tailwind + shadcn/ui build.

  COMPONENT BREAKDOWN (each root element carries data-component="..."):
  app/tracking/page.tsx                -> ProjectList
    ├─ StatusFilter                    (ToggleGroup)
    ├─ ProjectTable / ProjectGrid      (Table / Card, Badge, Avatar, Progress)
    ├─ ProjectsEmpty / ProjectsSkeleton
    └─ ProjectFormModal                (Dialog, Input, Textarea, Select, Checkbox)
  app/tracking/[projectId]/page.tsx    -> BoardView
    ├─ BoardToolbar                    (Breadcrumb, Badge, AvatarGroup, Popover "Archived")
    ├─ FilterBar                       (Input search, Select x4, Button clear)
    ├─ ListColumn[]                    (DropdownMenu rename/archive, inline rename Input)
    │    ├─ CardPreview[]              (draggable, keyboard-movable)
    │    └─ AddCardInline
    ├─ AddListColumn
    └─ BoardSkeleton
  app/tracking/dashboard/page.tsx      -> Dashboard
    ├─ StatTile x5 (open, overdue, due 7d, unassigned, completion)
    ├─ StackedChart (status by project/list; workload by person) + table view
    └─ PriorityBars, DeadlineList
  app/tracking/import/page.tsx         -> ImportPage (Upload → Review & assign → Created)
    ├─ ImportUpload (destination, Dropzone, template download, recent imports)
    ├─ ImportReview (editable table, validation, bulk assign, suggest assignees)
    └─ ImportDone
    API: POST /api/tracking/import (parse/extract → draft rows), POST /api/tracking/cards/bulk
  Shared: TrackingNav (Dashboard / Projects / Import / Reports tabs). Single department: no Workspace level.
  CardDetailPanel                      (Sheet side="right")
    ├─ EditableTitle, MarkdownEditor (Write/Preview Tabs)
    ├─ Checklist (Progress, Checkbox)
    ├─ CommentThread + MentionCombobox (Command/Popover)
    └─ CardFields aside: Status, Assignees, Priority, Dates, Labels
  Shared: Toaster (sonner), Avatar, StatusBadge, PriorityIndicator, DueChip, LabelChip

  Tokens follow shadcn/ui CSS variables (--background, --foreground, --muted, --primary, ...).
-->

<script>
  // theme init before paint
  (function () {
    var t = null;
    try { t = localStorage.getItem('pt-theme'); } catch (e) {}
    if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
  })();
</script>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
  const tok = v => `hsl(var(--${v}) / <alpha-value>)`;
  tailwind.config = {
    darkMode: 'class',
    theme: { extend: {
      fontFamily: { sans: ['"Noto Sans Thai"', '"Noto Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'] }, // Thai + Latin in one family; Noto Sans = Latin fallback
      // compact type scale (Tailwind default in comments); line-heights keep room for Thai vowels/tone marks
      fontSize: {
        xs: ['11px', '16px'],    // 12px
        sm: ['13px', '20px'],    // 14px
        base: ['14px', '22px'],  // 16px
        lg: ['16px', '24px'],    // 18px
        xl: ['18px', '26px'],    // 20px
        '2xl': ['21px', '30px'], // 24px
        '3xl': ['26px', '34px'], // 30px
      },
      colors: {
        border: tok('border'), input: tok('input'), ring: tok('ring'),
        background: tok('background'), foreground: tok('foreground'), card: tok('card'), column: tok('column'),
        muted: { DEFAULT: tok('muted'), foreground: tok('muted-foreground') },
        accent: { DEFAULT: tok('accent'), foreground: tok('foreground') },
        primary: { DEFAULT: tok('primary'), foreground: tok('primary-foreground') },
        destructive: { DEFAULT: tok('destructive'), foreground: tok('primary-foreground') },
      },
    } },
  };
</script>
<style>
  :root {
    --background: 0 0% 100%; --foreground: 222 47% 11%;

  .dark {
    --background: 224 22% 8%; --foreground: 210 20% 96%;
    --card: 222 18% 13%; --column: 223 19% 11%;
    --muted: 222 16% 17%; --muted-foreground: 218 12% 70%;
    --accent: 220 14% 21%; --border: 220 13% 22%; --input: 220 13% 32%;
    --primary: 217 91% 66%; --primary-foreground: 222 47% 11%;
    --destructive: 0 80% 66%; --ring: 217 91% 66%;
    /* status series (validated dark) */
    --s-done: #059669; --s-active: #3b82f6; --s-todo: #64748b; --s-overdue: #ef4444;

    --p-urgent: #e11d48; --p-high: #d97706; --p-medium: #3b82f6; --p-low: #64748b;
    color-scheme: dark;
  }
  * { border-color: hsl(var(--border)); }
  body { background: hsl(var(--background)); color: hsl(var(--foreground)); }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid hsl(var(--ring)); outline-offset: 2px; border-radius: 6px; }
  .card:focus-visible { outline-offset: -2px; } /* inside the scrolling list panel, so draw it inward */
  summary { list-style: none; } summary::-webkit-details-marker { display: none; }

  /* drag & drop */
  .is-dragging { opacity: .4; transform: rotate(1deg); }
  .drag-over { outline: 2px dashed hsl(var(--primary) / .7); outline-offset: -2px; background: hsl(var(--primary) / .06); }
  .drop-ind { height: 4px; flex-shrink: 0; border-radius: 9999px; background: hsl(var(--primary)); box-shadow: 0 0 0 3px hsl(var(--primary) / .2); }
  .list-drop { width: 4px; align-self: stretch; flex-shrink: 0; border-radius: 9999px; background: hsl(var(--primary)); }
  .just-dropped { animation: dropped .9s ease-out; }
  @keyframes dropped { 0% { box-shadow: 0 0 0 3px hsl(var(--primary) / .5); } 100% { box-shadow: 0 0 0 0 hsl(var(--primary) / 0); } }

  /* motion */
  .slide-in { animation: slideIn .22s cubic-bezier(.2,.8,.2,1); }
  .fade-in { animation: fadeIn .2s ease-out; }
  .pop-in { animation: popIn .18s ease-out; }
  .toast-in { animation: toastIn .25s ease-out; }
  @keyframes slideIn { from { transform: translateX(24px); opacity: 0; } }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes popIn { from { transform: scale(.97); opacity: 0; } }
  @keyframes toastIn { from { transform: translateY(8px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* markdown preview */
  .prose-md > * + * { margin-top: .6em; }
  .prose-md h3 { font-size: 1.05rem; font-weight: 600; } .prose-md h4 { font-weight: 600; } .prose-md h5 { font-weight: 600; font-size: .85rem; }
  .prose-md ul { list-style: disc; padding-left: 1.25rem; } .prose-md li + li { margin-top: .2em; }
  .prose-md li:has(> input) { list-style: none; margin-left: -1.25rem; }
  .prose-md code { font-family: ui-monospace, monospace; font-size: .85em; background: hsl(var(--muted)); padding: .1em .35em; border-radius: 4px; }
  .prose-md pre { background: hsl(var(--muted)); padding: .75rem; border-radius: 8px; overflow-x: auto; }
  .prose-md pre code { background: none; padding: 0; }
  .prose-md a { color: hsl(var(--primary)); text-decoration: underline; text-underline-offset: 2px; }

  .scroll-thin { scrollbar-width: thin; scrollbar-color: hsl(var(--border)) transparent; }
</style>

/* markdown (subset) */
function inlineMd(s) {
  return s.replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}
function md(src) {
  let out = '', inList = false, inCode = false, code = '';
  for (const raw of esc(src).split('\n')) {
    if (raw.trim().startsWith('```')) { if (inCode) { out += `<pre><code>${code}</code></pre>`; code = ''; inCode = false; } else { if (inList) { out += '</ul>'; inList = false; } inCode = true; } continue; }
    if (inCode) { code += raw + '\n'; continue; }
    const li = raw.match(/^\s*[-*]\s+(\[( |x)\]\s+)?(.*)$/);
    if (li) { if (!inList) { out += '<ul>'; inList = true; } out += `<li>${li[1] ? `<input type="checkbox" disabled ${li[2] === 'x' ? 'checked' : ''} aria-label="${li[2] === 'x' ? 'done' : 'not done'}"> ` : ''}${inlineMd(li[3])}</li>`; continue; }
    if (inList) { out += '</ul>'; inList = false; }
    const h = raw.match(/^(#{1,3})\s+(.*)$/);
    if (h) { const n = h[1].length + 2; out += `<h${n}>${inlineMd(h[2])}</h${n}>`; continue; }
    if (raw.trim()) out += `<p>${inlineMd(raw)}</p>`;
  }
  if (inList) out += '</ul>'; if (inCode) out += `<pre><code>${code}</code></pre>`;
  return out;
}
const renderComment = t => esc(t).replace(/@(\w+)/g, (m, h) => MEMBERS.some(x => x.handle === h)
  ? `<span class="rounded bg-primary/10 px-1 font-medium text-primary">@${h}</span>` : m).replace(/\n/g, '<br>');

/* filtering */
const isFiltering = () => Object.values(state.filters).some(Boolean) || !!state.search.trim();
function matches(c) {
  const f = state.filters, q = state.search.trim().toLowerCase();
  if (f.assignee) {
    if (f.assignee === 'none' ? c.assignees.length : !c.assignees.includes(f.assignee === 'me' ? ME : f.assignee)) return false;
  }
  if (f.label && !c.labels.includes(f.label)) return false;
  if (f.priority && c.priority !== f.priority) return false;
  if (f.due === 'overdue' && dueState(c) !== 'overdue') return false;
  if (f.due === 'week' && !(c.due && diffDays(c.due) >= 0 && diffDays(c.due) <= 7)) return false;
  if (f.due === 'none' && c.due) return false;
  if (q && !(c.title + ' ' + c.desc).toLowerCase().includes(q)) return false;
  return true;
}

function projectProgress(p) {

  const all = b.lists.flatMap(l => l.cardIds).filter(id => !b.cards[id].archived);
  const done = b.lists.filter(l => l.isDone).flatMap(l => l.cardIds).filter(id => !b.cards[id].archived);
  return [done.length, all.length];
}

  <div role="dialog" aria-modal="true" aria-labelledby="pf-title" aria-describedby="pf-desc" data-component="ProjectFormModal" class="pop-in flex max-h-[92vh] max-h-[92dvh] w-full max-w-lg flex-col rounded-t-2xl border bg-card shadow-xl sm:rounded-xl">
    <form id="project-form" novalidate class="flex min-h-0 flex-col">
      <div class="flex items-start justify-between gap-4 border-b px-6 py-4">
        <div><h2 id="pf-title" class="text-lg font-semibold">New project</h2><p id="pf-desc" class="text-sm text-muted-foreground">Creates a board with Backlog, To Do, In Progress and Done lists.</p></div>
        <button type="button" data-action="close-modal" aria-label="Close" class="${BTN_GHOST} h-8 w-8 p-0">${icon('x')}</button>
      </div>
      <div class="scroll-thin space-y-4 overflow-y-auto px-6 py-5">
        <div><label for="pf-name" class="mb-1.5 block text-sm font-medium">Project name <span class="text-destructive" aria-hidden="true">*</span></label>
          <input id="pf-name" name="name" required value="${esc(f.name)}" data-focus-key="pf-name" placeholder="e.g. Q1 Product Launch" class="${INPUT} ${e.name ? 'border-destructive' : ''}" ${inv('name')}>${err('name')}</div>
        <div><label for="pf-desc-in" class="mb-1.5 block text-sm font-medium">Description</label>
          <textarea id="pf-desc-in" name="desc" rows="3" placeholder="What is this project about?" class="${INPUT} h-auto py-2">${esc(f.desc)}</textarea></div>
        <div><label for="pf-owner" class="mb-1.5 block text-sm font-medium">Owner</label>
          <select id="pf-owner" name="owner" class="${INPUT}">${MEMBERS.map(m => `<option value="${m.id}" ${f.owner === m.id ? 'selected' : ''}>${esc(m.name)}${m.id === ME ? ' (you)' : ''}</option>`).join('')}</select></div>
        <div class="grid gap-4 sm:grid-cols-2">
          <div><label for="pf-start" class="mb-1.5 block text-sm font-medium">Start date</label><input id="pf-start" type="date" name="start" value="${f.start}" class="${INPUT}"></div>
          <div><label for="pf-end" class="mb-1.5 block text-sm font-medium">End date</label><input id="pf-end" type="date" name="end" value="${f.end}" class="${INPUT} ${e.end ? 'border-destructive' : ''}" ${inv('end')}>${err('end')}</div>
        </div>
        <fieldset><legend class="mb-1.5 text-sm font-medium">Members</legend>
          <div class="flex flex-wrap gap-2">${MEMBERS.map(m => { const on = f.members.includes(m.id); return `
            <label class="inline-flex cursor-pointer items-center gap-2 rounded-full border py-1 pl-1 pr-3 text-sm transition has-[:checked]:border-primary has-[:checked]:bg-primary/10 has-[:focus-visible]:ring-2 has-[:focus-visible]:ring-ring">
              <input type="checkbox" name="members" value="${m.id}" ${on ? 'checked' : ''} class="sr-only">${avatar(m.id)}${esc(m.name.split(' ')[0])}
              <span class="text-primary ${on ? '' : 'invisible'}" aria-hidden="true">${icon('check', 'h-3.5 w-3.5')}</span></label>`; }).join('')}</div>
        </fieldset>
      </div>
      <div class="flex justify-end gap-2 border-t px-6 py-4">
        <button type="button" data-action="close-modal" class="${BTN_OUTLINE}">Cancel</button>
        <button type="submit" class="${BTN_PRIMARY}" ${f.saving ? 'disabled' : ''}>${f.saving ? `${icon('loader', 'h-4 w-4 animate-spin')} Creating…` : 'Create project'}</button>
      </div>
    </form>
  </div></div>`;
}

/* =====================================================================
   COMPONENTS: BoardView
   ===================================================================== */
function FilterBar() {
  const p = proj(), f = state.filters;
  const nf = Object.values(f).filter(Boolean).length;
  const b = board(); const all = Object.values(b.cards).filter(c => !c.archived);
  const sel = (key, label, opts) => `<label class="relative block">
    <span class="sr-only">Filter by ${label.toLowerCase()}</span>
    <select data-filter="${key}" data-focus-key="filter-${key}" class="h-9 w-full appearance-none sm:h-8 sm:w-auto rounded-md border pl-2.5 pr-7 text-sm transition hover:bg-accent ${f[key] ? 'border-primary bg-primary/10 font-medium text-foreground' : 'bg-card text-muted-foreground'}">
      <option value="">${label}: Any</option>${opts.map(([v, t]) => `<option value="${v}" ${f[key] === v ? 'selected' : ''}>${label}: ${esc(t)}</option>`).join('')}
    </select>${icon('chevronDown', 'pointer-events-none absolute right-2 top-1/2 h-3.5 w-3.5 -translate-y-1/2 text-muted-foreground')}</label>`;
  return `<div data-component="FilterBar" role="search" aria-label="Filter cards" class="mt-3 flex flex-wrap items-center gap-2">
    <div class="relative min-w-0 flex-1 sm:w-60 sm:flex-none">${icon('search', 'pointer-events-none absolute left-2.5 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground')}
      <input type="search" id="board-search" data-focus-key="search" value="${esc(state.search)}" placeholder="Search cards" aria-label="Search cards" aria-keyshortcuts="/" class="${INPUT} h-9 pl-8 sm:h-8 sm:pr-8">
      <kbd class="pointer-events-none absolute right-2 top-1/2 hidden -translate-y-1/2 rounded border px-1 text-[10px] text-muted-foreground sm:block" aria-hidden="true">/</kbd></div>
    <button data-action="toggle-filters" data-focus-key="filters-btn" aria-expanded="${state.filtersOpen}" aria-controls="filter-fields" class="${BTN_OUTLINE} sm:hidden ${nf ? 'border-primary bg-primary/10' : ''}">
      ${icon('chevronDown', `h-4 w-4 transition-transform ${state.filtersOpen ? 'rotate-180' : ''}`)}Filters${nf ? ` (${nf})` : ''}</button>
    <div id="filter-fields" class="${state.filtersOpen ? 'grid' : 'hidden'} w-full grid-cols-2 gap-2 sm:flex sm:w-auto sm:flex-wrap sm:items-center">
      ${sel('assignee', 'Assignee', [['me', 'Me'], ...p.members.filter(id => id !== ME).map(id => [id, member(id).name]), ['none', 'Unassigned']])}
      ${sel('label', 'Label', LABELS.map(l => [l.id, l.name]))}
      ${sel('priority', 'Priority', PRIORITY_ORDER.map(k => [k, PRIORITIES[k].label]))}
      ${sel('due', 'Due', [['overdue', 'Overdue'], ['week', 'Next 7 days'], ['none', 'No date']])}
    </div>
    ${isFiltering() ? `<button data-action="clear-filters" data-focus-key="clear-filters" class="${BTN_GHOST}">${icon('x', 'h-3.5 w-3.5')}Clear${nf ? ` (${nf})` : ''}</button>
      <span class="text-xs text-muted-foreground" role="status">${all.filter(matches).length} of ${all.length} cards</span>` : ''}
  </div>`;
}

/* Card layout: priority badge · title · assignees (+) · SUBTASKS (tick on the card) · time / due / files / comments.
   Cards in a list are stacked in one panel with dividers (see ListColumn). The card itself is a focusable group
   (Enter opens, Alt+arrows move); the checkboxes and "+" buttons inside are their own controls. */
const SUBTASKS_SHOWN = 3;
function CardPreview(c) {
  const done = c.checklist.filter(i => i.done).length, tot = c.checklist.length, pend = pending.has(c.id);
  const shown = c.checklist.slice(0, SUBTASKS_SHOWN), more = tot - shown.length;
  const meta = [];
  if (c.est) meta.push(`<span class="inline-flex items-center gap-1" title="Time spent / estimate">${icon('clock', 'h-3.5 w-3.5')}${c.spent || 0}h/${c.est}h</span>`);
  if (c.due) meta.push(dueChip(c));
  if (c.files) meta.push(`<span class="inline-flex items-center gap-1">${icon('file', 'h-3.5 w-3.5')}<span>${c.files} file${c.files === 1 ? '' : 's'}</span></span>`);
  if (c.comments.length) meta.push(`<span class="inline-flex items-center gap-1">${icon('msg', 'h-3.5 w-3.5')}<span>${c.comments.length} comment${c.comments.length === 1 ? '' : 's'}</span></span>`);
  return `<li data-card-id="${c.id}" data-focus-key="card-${c.id}" draggable="true" tabindex="0" role="group"
    aria-label="${esc(cardSummary(c))}" aria-describedby="kbd-help" aria-busy="${pend}" data-component="CardPreview"
    class="card group relative cursor-pointer select-none px-4 py-3.5 transition-colors hover:bg-muted/40 ${pend ? 'opacity-75' : ''} ${state.lastDropped === c.id ? 'just-dropped' : ''}">
    <div class="flex flex-wrap items-center gap-1.5">
      <span class="rounded px-1.5 py-0.5 text-[10px] font-bold uppercase leading-4 tracking-wide text-white" style="background:var(--pb-${c.priority})">${PRIORITIES[c.priority].label}</span>
      ${c.labels.map(labelChip).join('')}
    </div>
    <p class="mt-2 text-[15px] font-semibold leading-snug">${esc(c.title)}</p>
    <div class="mt-2.5 flex items-center">
      ${c.assignees.length ? avatarStack(c.assignees, 4, 'h-7 w-7 text-[10px]') : ''}
      <button data-action="card-assign" data-value="${c.id}" aria-label="Add assignee" title="Add assignee"
        class="${c.assignees.length ? '-ml-1' : ''} inline-flex h-7 w-7 items-center justify-center rounded-full border border-dashed border-muted-foreground/60 bg-card text-muted-foreground transition-colors hover:border-primary hover:text-primary">${icon('plus', 'h-3.5 w-3.5')}</button>
    </div>
    <div class="mt-3">
      <div class="flex items-center justify-between">
        <span class="text-[11px] font-bold uppercase tracking-wide text-foreground/80">${tot ? `${tot} subtasks` : 'Subtasks'}</span>
        <button data-action="card-add-subtask" data-value="${c.id}" aria-label="Add subtask" title="Add subtask"
          class="-mr-1 inline-flex h-6 w-6 items-center justify-center rounded text-foreground/70 hover:bg-accent hover:text-foreground">${icon('plus', 'h-4 w-4')}</button>
      </div>
      ${shown.length ? `<ul class="mt-1 space-y-0.5">${shown.map(i => `<li><label class="flex cursor-pointer items-center gap-2 py-0.5 text-[13px]">
          <input type="checkbox" data-card-check="${c.id}" data-item="${i.id}" data-focus-key="cc-${i.id}" ${i.done ? 'checked' : ''} class="h-3.5 w-3.5 shrink-0" style="accent-color:hsl(var(--primary))">
          <span class="truncate ${i.done ? 'text-muted-foreground line-through' : ''}">${esc(i.text)}</span></label></li>`).join('')}
        ${more > 0 ? `<li class="pl-5 text-xs text-muted-foreground">+${more} more</li>` : ''}</ul>` : ''}
    </div>
    ${meta.length ? `<div class="mt-3 flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-muted-foreground">${meta.join('')}</div>` : ''}
    ${pend ? `<span class="absolute right-2 top-2 inline-flex items-center gap-1 rounded bg-card/95 px-1.5 py-0.5 text-[11px] font-medium text-muted-foreground shadow-sm">${icon('loader', 'h-3 w-3 animate-spin')}Saving</span>` : ''}
  </li>`;
}

function AddCardInline(list) {
  if (state.addingCard === list.id) return `<form data-form="add-card" data-list="${list.id}" class="p-2 pt-1">
      <textarea name="title" rows="2" data-focus-key="addcard-${list.id}" placeholder="Enter a title for this card…" aria-label="New card title in ${esc(list.name)}" class="w-full resize-none rounded-md border border-input bg-card p-2 text-sm shadow-sm placeholder:text-muted-foreground"></textarea>
      <div class="mt-1.5 flex items-center gap-1.5"><button type="submit" class="${BTN_PRIMARY} h-8">Add card</button>
        <button type="button" data-action="add-card-cancel" aria-label="Cancel adding card" class="${BTN_GHOST} h-8 w-8 p-0">${icon('x')}</button>
        <span class="ml-auto text-[11px] text-muted-foreground">Enter to add · Esc to cancel</span></div>
    </form>`;
  return `<div class="p-2 pt-1"><button data-action="add-card-open" data-value="${list.id}" data-focus-key="addbtn-${list.id}" class="flex w-full items-center justify-center gap-1.5 rounded-md px-2 py-2 text-xs font-bold uppercase tracking-wide text-primary hover:bg-primary/10">${icon('plus')}Add card</button></div>`;
}

function ListColumn(list) {
  const b = board(), cards = list.cardIds.map(id => b.cards[id]).filter(c => !c.archived);
  const vis = cards.filter(matches), filt = isFiltering();
  const menu = state.listMenu === list.id, renaming = state.renamingList === list.id, pend = pending.has('list:' + list.id);
  const count = filt ? `${vis.length}/${cards.length}` : cards.length;
  return `<section role="listitem" data-list-id="${list.id}" data-component="ListColumn" aria-labelledby="lh-${list.id}"
    class="list-col flex max-h-full w-[min(18rem,calc(100vw-3rem))] snap-start shrink-0 flex-col rounded-xl border border-border/70 bg-column transition-colors ${pend ? 'opacity-75' : ''}">
    <div class="flex items-center gap-1 px-2 pb-1 pt-2">
      <button draggable="true" data-list-drag="${list.id}" data-focus-key="lgrip-${list.id}" aria-label="Move list ${esc(list.name)}. Alt plus Left or Right arrow to reorder." title="Drag to reorder"
        class="flex h-7 w-5 cursor-grab items-center justify-center rounded text-muted-foreground hover:bg-accent active:cursor-grabbing">${icon('grip', 'h-4 w-4')}</button>
      ${renaming
        ? `<input data-rename-list="${list.id}" data-focus-key="rename-${list.id}" value="${esc(list.name)}" aria-label="List name" class="${INPUT} h-7 flex-1 px-2 text-sm font-semibold">`
        : `<h2 id="lh-${list.id}" class="min-w-0 flex-1"><button data-action="rename-list" data-value="${list.id}" title="Click to rename" class="w-full truncate rounded px-1.5 py-1 text-left text-sm font-semibold hover:bg-accent">${esc(list.name)}</button></h2>`}
      ${pend ? icon('loader', 'h-3.5 w-3.5 animate-spin text-muted-foreground') : ''}
      <span class="rounded-full bg-muted px-2 py-0.5 text-xs font-medium tabular-nums text-muted-foreground" aria-label="${filt ? `${vis.length} of ${cards.length}` : cards.length} cards">${count}</span>
      <div class="relative">
        <button data-action="list-menu" data-value="${list.id}" data-focus-key="lmenu-${list.id}" aria-haspopup="menu" aria-expanded="${menu}" aria-label="Actions for list ${esc(list.name)}" class="${BTN_GHOST} h-7 w-7 p-0">${icon('more')}</button>
        ${menu ? `<div role="menu" aria-label="List actions" class="pop-in absolute right-0 top-full z-30 mt-1 w-44 rounded-md border bg-card p-1 shadow-lg">
          <button role="menuitem" data-action="rename-list" data-value="${list.id}" data-focus-key="lm-rename" class="flex w-full items-center rounded px-2 py-1.5 text-left text-sm hover:bg-accent">Rename</button>
          <button role="menuitem" data-action="add-card-open" data-value="${list.id}" class="flex w-full items-center rounded px-2 py-1.5 text-left text-sm hover:bg-accent">Add card</button>
          <div class="my-1 h-px bg-border" role="separator"></div>
          <button role="menuitem" data-action="archive-list" data-value="${list.id}" class="flex w-full items-center gap-2 rounded px-2 py-1.5 text-left text-sm text-destructive hover:bg-accent">${icon('archive', 'h-3.5 w-3.5')}Archive list</button>
        </div>` : ''}
      </div>
    </div>
    <ol data-cards class="scroll-thin mx-2 mt-1 flex min-h-[3.5rem] flex-col divide-y divide-border overflow-y-auto rounded-lg bg-card shadow-sm ring-1 ring-border/60" aria-label="${esc(list.name)} cards">
      ${vis.length ? vis.map(CardPreview).join('') : `<li class="rounded-lg border border-dashed px-3 py-6 text-center text-xs text-muted-foreground">${filt && cards.length ? 'No cards match the filters' : 'No cards yet. Drop a card here or add one.'}</li>`}
    </ol>
    ${AddCardInline(list)}
  </section>`;
}

function AddListColumn() {
  if (state.addingList) return `<form data-form="add-list" class="w-[min(18rem,calc(100vw-3rem))] snap-start shrink-0 rounded-xl border bg-column p-2">
    <input name="name" data-focus-key="addlist" placeholder="List name" aria-label="New list name" class="${INPUT} h-8">
    <div class="mt-2 flex gap-1.5"><button type="submit" class="${BTN_PRIMARY} h-8">Add list</button><button type="button" data-action="add-list-cancel" aria-label="Cancel" class="${BTN_GHOST} h-8 w-8 p-0">${icon('x')}</button></div></form>`;
  return `<button data-action="add-list-open" data-focus-key="addlist-btn" class="flex h-11 w-[min(18rem,calc(100vw-3rem))] snap-start shrink-0 items-center gap-1.5 rounded-xl border border-dashed px-3 text-sm font-medium text-muted-foreground hover:border-solid hover:bg-column hover:text-foreground">${icon('plus')}Add list</button>`;
}

function BoardSkeleton() {
  return [3, 2, 4, 2].map(n => `<div class="w-[min(18rem,calc(100vw-3rem))] snap-start shrink-0 animate-pulse rounded-xl border bg-column p-2" aria-hidden="true">
    <div class="mb-3 flex items-center justify-between px-1 pt-1"><div class="h-4 w-24 rounded bg-muted"></div><div class="h-4 w-6 rounded-full bg-muted"></div></div>
    ${Array.from({ length: n }, () => `<div class="mb-2 space-y-2 rounded-lg border bg-card p-3"><div class="h-3 w-14 rounded bg-muted"></div><div class="h-3.5 w-full rounded bg-muted"></div><div class="h-3.5 w-2/3 rounded bg-muted"></div><div class="flex justify-between pt-1"><div class="h-3 w-20 rounded bg-muted"></div><div class="h-5 w-5 rounded-full bg-muted"></div></div></div>`).join('')}
  </div>`).join('') + '<span class="sr-only" role="status">Loading board…</span>';
}

function BoardView() {
  const p = proj(), b = board(), archived = Object.values(b.cards).filter(c => c.archived);
  return `<section data-component="BoardView" class="flex h-full flex-col" aria-label="${esc(p.name)} board">
    <header class="border-b px-4 pb-3 pt-3 sm:px-6" data-component="BoardToolbar">
      <nav aria-label="Breadcrumb" class="mb-1 hidden text-xs text-muted-foreground sm:block"><ol class="flex items-center gap-1">
                <li><a href="#/tracking" data-action="go-projects" class="hover:text-foreground hover:underline">Projects</a></li><li aria-hidden="true">/</li>
        <li aria-current="page" class="text-foreground">${esc(p.name)}</li></ol></nav>
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex min-w-0 items-center gap-2">
          <button aria-label="Back to projects" data-action="go-projects" class="${BTN_GHOST} h-8 w-8 p-0">${icon('chevronLeft')}</button>
          <h1 class="truncate text-lg font-semibold tracking-tight sm:text-xl">${esc(p.name)}</h1><span class="shrink-0">${statusBadge(p.status)}</span>
        </div>
        <div class="flex items-center gap-3">
          <span class="hidden items-center gap-2 md:flex"><span class="sr-only">Members:</span>${avatarStack(p.members, 5, 'h-7 w-7 text-[11px]')}</span>
          <button data-action="go-import" data-value="${p.id}" aria-label="Import tasks" class="${BTN_OUTLINE} h-8">${icon('upload', 'h-3.5 w-3.5')}<span class="hidden sm:inline">Import</span></button>
          <div class="relative">
            <button data-action="toggle-archived" data-focus-key="archived-btn" aria-haspopup="menu" aria-expanded="${state.showArchived}" aria-label="Archived cards" class="${BTN_OUTLINE} h-8">${icon('archive', 'h-3.5 w-3.5')}<span class="hidden sm:inline">Archived</span><span class="rounded-full bg-muted px-1.5 text-xs tabular-nums">${archived.length}</span></button>
            ${state.showArchived ? `<div role="menu" aria-label="Archived cards" class="pop-in absolute right-0 top-full z-30 mt-1 w-72 rounded-md border bg-card p-1 shadow-lg">
              <div class="px-2 py-1.5 text-xs font-medium text-muted-foreground">Archived cards</div>
              ${archived.length ? archived.map(c => `<button role="menuitem" data-action="open-card" data-value="${c.id}" class="block w-full truncate rounded px-2 py-1.5 text-left text-sm hover:bg-accent">${esc(c.title)}</button>`).join('')
                : '<p class="px-2 pb-3 pt-1 text-sm text-muted-foreground">Nothing archived. Archived cards show up here and can be restored.</p>'}
            </div>` : ''}
          </div>
        </div>
      </div>
      ${FilterBar()}
    </header>
    <div id="split-wrap" class="flex min-h-0 flex-1 flex-col">
      <section id="sec-board" aria-labelledby="sec-board-h" class="flex flex-col overflow-hidden ${state.boardCollapsed ? 'shrink-0' : 'min-h-0'}" style="${state.boardCollapsed ? '' : state.ganttOpen ? `flex:${state.split} 1 0%` : 'flex:1 1 0%'}">
        ${SectionBar('board', !state.boardCollapsed, 'columns', 'Board', `${b.lists.length} lists · ${Object.values(b.cards).filter(c => !c.archived).length} cards`)}
        ${state.boardCollapsed ? '' : `<div id="board-scroll" data-scroll-key="board" role="list" aria-label="Lists" class="scroll-thin flex min-h-0 flex-1 snap-x snap-mandatory scroll-px-4 items-start gap-3 overflow-x-auto px-4 py-4 sm:snap-none sm:px-6">
          ${state.loading ? BoardSkeleton() : b.lists.map(ListColumn).join('') + AddListColumn()}
        </div>`}
      </section>
      ${Splitter()}
      <section id="sec-gantt" aria-labelledby="sec-gantt-h" data-component="GanttChart" class="flex flex-col overflow-hidden ${isMobile() ? 'border-t' : ''} ${state.ganttOpen ? 'min-h-0' : 'mt-auto shrink-0'}" style="${!state.ganttOpen ? '' : state.boardCollapsed ? 'flex:1 1 0%' : `flex:${(1 - state.split).toFixed(2)} 1 0%`}">
        ${SectionBar('gantt', state.ganttOpen, 'gantt', 'Timeline', 'Who finishes which task, by date', state.ganttOpen ? GanttControls() : '')}
        ${state.ganttOpen ? (state.loading ? GanttSkeleton() : GanttChart()) : ''}
      </section>
    </div>
  </section>`;
}

/* =====================================================================
   COMPONENTS: Splitter (resizable Board ↕ Timeline)
   Drag / Arrow keys resize · drag past ~12% from an edge collapses that
   section · Home/End = min/max · Enter or double-click = 50/50.
   ===================================================================== */
function Splitter() {
  if (isMobile()) return ''; // phones: sections are exclusive, headers toggle
  const both = !state.boardCollapsed && state.ganttOpen;
  const pct = both ? Math.round(state.split * 100) : state.boardCollapsed ? 0 : 100;
  return `<div id="splitter" role="separator" tabindex="0" data-focus-key="splitter" aria-orientation="horizontal" aria-controls="sec-board sec-gantt"
      aria-label="Resize board and timeline" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-valuetext="Board ${pct}%, timeline ${100 - pct}%"
      title="Drag to resize · double-click to reset"
      class="group relative z-10 flex h-3 shrink-0 cursor-row-resize touch-none items-center justify-center border-t bg-muted/40 transition-colors hover:bg-primary/10 focus-visible:bg-primary/10">
      <span class="h-1 w-12 rounded-full bg-input transition-colors group-hover:bg-primary group-focus-visible:bg-primary group-[.is-resizing]:bg-primary" aria-hidden="true"></span>
    </div>`;
}
function setSplit(v) {
  if (v < 0.12) { state.boardCollapsed = true; state.ganttOpen = true; announce('Board collapsed.'); }
  else if (v > 0.88) { state.boardCollapsed = false; state.ganttOpen = false; announce('Timeline collapsed.'); }
  else {
    state.boardCollapsed = false; state.ganttOpen = true;
    state.split = Math.round(Math.min(0.85, Math.max(0.15, v)) * 100) / 100;
    try { localStorage.setItem('pt-split', state.split); } catch (e) {}
    announce(`Board ${Math.round(state.split * 100)} percent, timeline ${100 - Math.round(state.split * 100)} percent.`);
  }
  if (document.activeElement?.id === 'splitter') state.pendingFocus = 'splitter';
  render();
}

/* =====================================================================
   COMPONENTS: SectionBar + GanttChart (timeline grouped by assignee)
   ===================================================================== */
function SectionBar(key, open, ic, title, meta, extra = '') {
  return `<div class="flex flex-wrap items-center gap-x-2 gap-y-1 border-b bg-muted/40 px-4 py-1.5 sm:px-6">
    <button id="sec-${key}-h" data-action="toggle-section" data-value="${key}" data-focus-key="sec-${key}" aria-expanded="${open}" aria-controls="sec-${key}-body"
      class="inline-flex items-center gap-2 rounded-md px-1.5 py-1 text-sm font-semibold hover:bg-accent">
      ${icon('chevronDown', `h-4 w-4 text-muted-foreground transition-transform ${open ? '' : '-rotate-90'}`)}${icon(ic, 'h-4 w-4 text-muted-foreground')}${title}
      <span class="sr-only">${open ? '(expanded, press to collapse)' : '(collapsed, press to expand)'}</span>
    </button>
    <span class="hidden text-xs text-muted-foreground sm:inline">${meta}</span>
    <div class="ml-auto flex flex-wrap items-center gap-1.5">${extra}</div>
  </div>`;
}

const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
let GANTT_LEFT = 232;
const ganttDayW = () => { const d = state.gantt.days; return isMobile() ? (d <= 14 ? 40 : d <= 28 ? 28 : 16) : (d <= 14 ? 56 : d <= 28 ? 36 : 20); };
const cardSpan = c => [c.start || c.due, c.due || c.start];

function barTone(c) {
  const l = listOfCard(c.id);
  if (l?.isDone) return { key: 'done', label: 'Done', ic: 'check', cls: 'bg-emerald-100 text-emerald-900 border-emerald-600 dark:bg-emerald-400/15 dark:text-emerald-100 dark:border-emerald-400' };
  if (dueState(c) === 'overdue') return { key: 'overdue', label: 'Overdue', ic: 'alert', cls: 'bg-red-100 text-red-900 border-red-600 dark:bg-red-400/15 dark:text-red-100 dark:border-red-400' };
  if (/progress/i.test(l?.name || '')) return { key: 'active', label: 'In progress', ic: 'clock', cls: 'bg-blue-100 text-blue-900 border-blue-600 dark:bg-blue-400/15 dark:text-blue-100 dark:border-blue-400' };
  return { key: 'todo', label: 'Not started', ic: 'circle', cls: 'bg-slate-100 text-slate-800 border-slate-500 dark:bg-slate-400/15 dark:text-slate-200 dark:border-slate-400' };
}

function GanttControls() {
  const g = state.gantt, end = addDays(g.start, g.days - 1);
  const zb = (n, l) => `<button data-action="gantt-zoom" data-value="${n}" data-focus-key="gz-${n}" aria-pressed="${g.days === n}" class="rounded px-2 py-0.5 text-xs font-medium ${g.days === n ? 'bg-card text-foreground shadow-sm' : 'text-muted-foreground hover:text-foreground'}">${l}</button>`;
  return `<span class="mr-1 hidden text-xs font-medium tabular-nums sm:inline">${fmt(g.start)} – ${fmtY(end)}</span>
    <button data-action="gantt-prev" data-focus-key="g-prev" aria-label="Previous week" class="${BTN_GHOST} h-7 w-7 p-0">${icon('chevronLeft')}</button>
    <button data-action="gantt-today" data-focus-key="g-today" class="${BTN_OUTLINE} h-7 px-2 text-xs">Today</button>
    <button data-action="gantt-next" data-focus-key="g-next" aria-label="Next week" class="${BTN_GHOST} h-7 w-7 p-0">${icon('chevronRight')}</button>
    <div role="group" aria-label="Time range" class="inline-flex rounded-md bg-muted p-0.5">${zb(14, '2W')}${zb(28, '4W')}${zb(56, '8W')}</div>`;
}

function GanttSkeleton() {
  return `<div class="flex-1 space-y-3 p-4 sm:px-6" aria-busy="true"><span class="sr-only" role="status">Loading timeline…</span>
    ${[40, 55, 30, 65, 45].map((w, i) => `<div class="flex animate-pulse items-center gap-4"><div class="h-4 w-48 rounded bg-muted"></div><div class="h-6 rounded bg-muted" style="width:${w}%;margin-left:${i * 6}%"></div></div>`).join('')}</div>`;
}

function GanttChart() {
  GANTT_LEFT = isMobile() ? 148 : window.matchMedia('(max-width: 1023px)').matches ? 200 : 232;
  const g = state.gantt, dayW = ganttDayW(), W = g.days * dayW, end = addDays(g.start, g.days - 1);
  const dates = Array.from({ length: g.days }, (_, i) => addDays(g.start, i));
  const b = board(), p = proj();
  const cards = Object.values(b.cards).filter(c => !c.archived && matches(c));
  const inRange = c => { const [s, e] = cardSpan(c); return s && e >= g.start && s <= end; };
  const unscheduled = cards.filter(c => !c.start && !c.due);
  const outside = cards.filter(c => (c.start || c.due) && !inRange(c)).length;
  const groups = [...p.members, 'none']
    .map(id => ({ id, items: cards.filter(c => (id === 'none' ? !c.assignees.length : c.assignees.includes(id)) && inRange(c)).sort((x, y) => cardSpan(x)[0].localeCompare(cardSpan(y)[0])) }))
    .filter(gr => gr.id !== 'none' || gr.items.length);
  const total = new Set(groups.flatMap(gr => gr.items.map(c => c.id))).size;
  const todayOff = daysBetween(g.start, iso(TODAY));
  const months = [];
  dates.forEach(d => { const k = d.slice(0, 7), last = months[months.length - 1]; if (last && last.k === k) last.n++; else months.push({ k, n: 1, label: parse(d).toLocaleDateString(LOC(), { month: dayW < 30 ? 'short' : 'long', year: 'numeric' }) }); });
  // dayW is now the MINIMUM day width; the timeline stretches to fill the container (positions in %)
  const pc = n => `${(n / g.days) * 100}%`;
  const grid = `background-image:linear-gradient(to right, hsl(var(--border) / .7) 1px, transparent 1px);background-size:calc(100% / ${g.days}) 100%`;
  const leftCell = (inner, extra = '') => `<div class="sticky left-0 z-20 flex shrink-0 border-r ${extra}" style="width:${GANTT_LEFT}px">${inner}</div>`;

  const bar = (c, who) => {
    const [s, e] = cardSpan(c), t = barTone(c);
    const from = Math.max(0, daysBetween(g.start, s)), to = Math.min(g.days - 1, daysBetween(g.start, e));
    const clipL = s < g.start, clipR = e > end;
    const done = c.checklist.filter(i => i.done).length, pct = c.checklist.length ? done / c.checklist.length * 100 : 0;
    const label = `${who}: ${c.title}. ${fmt(s)} to ${fmt(e)}. ${t.label}. ${PRIORITIES[c.priority].label} priority${c.checklist.length ? `. Checklist ${done} of ${c.checklist.length}` : ''}.`;
    return `<button data-action="open-card" data-value="${c.id}" data-focus-key="bar-${c.id}-${who}" aria-label="${esc(label)}" title="${esc(c.title)} · ${fmt(s)} – ${fmt(e)} · ${t.label}"
      class="absolute top-2 flex h-7 items-center gap-1 overflow-hidden border-l-4 px-1.5 text-left text-xs font-medium shadow-sm transition hover:brightness-95 hover:shadow ${t.cls} ${clipL ? 'rounded-l-none' : 'rounded-l-md'} ${clipR ? 'rounded-r-none' : 'rounded-r-md'}"
      style="left:calc(${pc(from)} + 3px);width:calc(${pc(to - from + 1)} - 6px)">
      ${clipL ? icon('chevronLeft', 'h-3 w-3') : ''}${icon(t.ic, 'h-3.5 w-3.5')}<span class="truncate">${esc(c.title)}</span>${clipR ? icon('chevronRight', 'ml-auto h-3 w-3') : ''}
      ${pct ? `<span class="absolute bottom-0 left-0 h-[3px] bg-current opacity-50" style="width:${pct}%" aria-hidden="true"></span>` : ''}
    </button>`;
  };

  const rows = groups.map(gr => {
    const m = gr.id === 'none' ? null : member(gr.id), who = m ? m.name : 'Unassigned';
    const overdue = gr.items.filter(c => barTone(c).key === 'overdue').length;
    const head = `<div class="relative flex border-b bg-muted">
      ${leftCell(`<div class="flex w-full items-center gap-2 px-3 py-1.5">${m ? avatar(m.id) : `<span class="inline-flex h-6 w-6 items-center justify-center rounded-full border border-dashed text-[10px] text-muted-foreground">?</span>`}
        <span class="truncate text-sm font-semibold">${esc(who)}</span>
        <span class="ml-auto shrink-0 text-xs text-muted-foreground">${gr.items.length ? `${gr.items.length} task${gr.items.length === 1 ? '' : 's'}` : 'Free'}${overdue ? ` · <span class="font-medium text-red-700 dark:text-red-300">${overdue} overdue</span>` : ''}</span></div>`, 'bg-muted')}
      <div class="min-w-0 flex-1"></div></div>`;
    const items = gr.items.map(c => { const [s, e] = cardSpan(c), l = listOfCard(c.id); return `<div class="relative flex border-b border-border/60">
      ${leftCell(`<div class="flex min-w-0 flex-col justify-center py-1 pl-4 pr-3 sm:pl-11">
        <button data-action="open-card" data-value="${c.id}" class="truncate text-left text-sm hover:underline" tabindex="-1">${esc(c.title)}</button>
        <span class="truncate text-[11px] text-muted-foreground">${esc(l.name)} · ${fmt(s)}${s !== e ? ` – ${fmt(e)}` : ''}</span></div>`, 'bg-background')}
      <div class="relative h-11 min-w-0 flex-1" style="${grid}">${bar(c, who)}</div></div>`; }).join('');
    return head + items;
  }).join('');

  return `<div id="sec-gantt-body" class="flex min-h-0 flex-1 flex-col">
    <div class="scroll-thin relative min-h-0 flex-1 overflow-auto" data-scroll-key="gantt">
      <div class="relative min-h-full" style="min-width:${GANTT_LEFT + W}px">
        <div class="pointer-events-none absolute inset-y-0 right-0" style="left:${GANTT_LEFT}px" aria-hidden="true">
          ${dates.map((d, i) => parse(d).getDay() % 6 === 0 ? `<div class="absolute inset-y-0 bg-muted/60" style="left:${pc(i)};width:${pc(1)}"></div>` : '').join('')}
          ${todayOff >= 0 && todayOff < g.days ? `<div class="absolute inset-y-0 z-[25] w-0.5 bg-primary" style="left:calc(${pc(todayOff + 0.5)} - 1px)"></div>` : ''}
        </div>
        <div class="sticky top-0 z-30 flex border-b bg-background">
          <div class="sticky left-0 z-40 flex shrink-0 items-end border-r bg-background px-3 pb-1.5 text-xs font-medium text-muted-foreground" style="width:${GANTT_LEFT}px">Assignee / task</div>
          <div class="min-w-0 flex-1">
            <div class="flex border-b">${months.map(mo => `<div class="min-w-0 truncate border-r px-2 py-1 text-xs font-semibold" style="flex:${mo.n} 1 0%">${mo.label}</div>`).join('')}</div>
            <div class="flex">${dates.map((d, i) => { const dt = parse(d), wk = dt.getDay() % 6 === 0, td = i === todayOff;
              return `<div class="flex min-w-0 flex-col items-center border-r py-1 text-[11px] leading-tight ${wk ? 'bg-muted/60 text-muted-foreground' : ''}" style="flex:1 1 0%" ${td ? 'aria-current="date"' : ''}>
                ${dayW >= 30 ? `<span class="text-[10px] text-muted-foreground">${dt.toLocaleDateString(LOC(), { weekday: 'narrow' })}</span>` : ''}
                <span class="${td ? 'rounded-full bg-primary px-1.5 font-semibold text-primary-foreground' : ''}">${dt.getDate()}</span></div>`; }).join('')}</div>
          </div>
        </div>
        ${total ? rows : `<div class="sticky left-0 flex flex-col items-start gap-2 px-6 py-10" style="width:min(100%,32rem)">
          <p class="text-sm font-semibold">No scheduled work between ${fmt(g.start)} and ${fmtY(end)}</p>
          <p class="text-sm text-muted-foreground">${isFiltering() ? 'Filters may be hiding tasks. ' : ''}Add start or due dates to cards to place them on the timeline.</p>
          <button data-action="gantt-today" class="${BTN_OUTLINE} h-8">Jump to today</button></div>`}
      </div>
    </div>
    <div class="flex flex-wrap items-center gap-x-4 gap-y-2 border-t px-4 py-2 text-xs sm:px-6">
      <span class="sr-only">Legend:</span>
      ${[['circle', 'Not started', 'bg-slate-100 border-slate-500 text-slate-800 dark:bg-slate-400/15 dark:text-slate-200'], ['clock', 'In progress', 'bg-blue-100 border-blue-600 text-blue-900 dark:bg-blue-400/15 dark:text-blue-100'], ['check', 'Done', 'bg-emerald-100 border-emerald-600 text-emerald-900 dark:bg-emerald-400/15 dark:text-emerald-100'], ['alert', 'Overdue', 'bg-red-100 border-red-600 text-red-900 dark:bg-red-400/15 dark:text-red-100']]
        .map(([ic, l, cls]) => `<span class="inline-flex items-center gap-1.5"><span class="inline-flex h-4 w-6 items-center justify-center rounded-sm border-l-4 ${cls}">${icon(ic, 'h-3 w-3')}</span>${l}</span>`).join('')}
      <span class="inline-flex items-center gap-1.5 text-muted-foreground"><span class="h-3 w-0.5 bg-primary" aria-hidden="true"></span>Today</span>
      <span class="ml-auto flex flex-wrap items-center gap-1.5 text-muted-foreground">
        ${outside ? `<span>${outside} outside this range</span><span aria-hidden="true">·</span>` : ''}
        ${unscheduled.length ? `<span>Unscheduled:</span>${unscheduled.map(c => `<button data-action="open-card" data-value="${c.id}" class="max-w-[12rem] truncate rounded border border-dashed px-1.5 py-0.5 text-foreground hover:bg-accent">${esc(c.title)}</button>`).join('')}` : '<span>All tasks scheduled</span>'}
      </span>
    </div>
  </div>`;
}

  const tiles = `<div class="grid grid-cols-2 gap-3 md:grid-cols-3 xl:grid-cols-5">

    ${StatTile({ ic: 'calendar', label: 'Due in 7 days', value: week, sub: 'Open tasks due this week', drill: single && week && 'week' })}

      <p class="flex items-center gap-1.5 text-sm text-muted-foreground">${icon('circleCheck')}Completion</p>
      <p class="mt-2 text-3xl font-semibold tabular-nums tracking-tight">${pct}%</p>
      <div class="mt-2 h-1.5 overflow-hidden rounded-full bg-muted" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Completion"><div class="h-full rounded-full" style="width:${pct}%;background:var(--s-done)"></div></div>

  return PageShell('Dashboard', 'dashboard', header + tiles + `
    <div class="mt-4 grid gap-4 lg:grid-cols-2">

      ${DashPanel('Open tasks by priority', `${open.length} open tasks`, priority)}
      ${DashPanel('Deadlines', 'Overdue and due in the next 14 days', upList)}

const ALIASES = { title: ['title', 'task', 'name', 'ชื่องาน', 'งาน'], desc: ['description', 'desc', 'details', 'รายละเอียด'], label: ['label', 'labels', 'tag', 'ป้าย'],

  assignee: ['assignee', 'owner', 'ผู้รับผิดชอบ'], checklist: ['checklist', 'subtasks', 'งานย่อย'] };
const PRI_ALIASES = { low: ['low', 'ต่ำ'], medium: ['medium', 'med', 'normal', 'กลาง', 'ปานกลาง'], high: ['high', 'สูง'], urgent: ['urgent', 'critical', 'ด่วน', 'ด่วนมาก'] };

function parseCSV(text) {
  text = text.replace(/^﻿/, ''); const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim()));
}
// returns [isoDate | '', unreadable?]; accepts YYYY-MM-DD, D/M/YYYY (Buddhist-era years converted), Date objects
function normDate(v) {
  // Excel date cell = serial day number (1900 system). Convert in UTC: SheetJS's cellDates
  // shifts dates by the historical LMT offset (e.g. Bangkok) and lands on the previous day.
  if (typeof v === 'number' && v > 20000 && v < 80000) { const u = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 864e5); return [`${u.getUTCFullYear()}-${String(u.getUTCMonth() + 1).padStart(2, '0')}-${String(u.getUTCDate()).padStart(2, '0')}`, false]; }
  if (Object.prototype.toString.call(v) === '[object Date]' && !isNaN(v)) return [iso(v), false];
  const s = String(v ?? '').trim(); if (!s) return ['', false];

async function handleFile(file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if (file.size > 10 * 1024 * 1024) return impFail('File is too large', `${file.name} is ${(file.size / 1048576).toFixed(1)} MB. The limit is 10 MB.`);
  try {
    if (ext === 'csv') { impBusy(file.name, ['Reading file', 'Matching columns']); const text = await file.text(); await sleep(250); stepBusy(); await sleep(250); return impFinishTemplate(file.name, parseCSV(text)); }
    if (ext === 'xlsx' || ext === 'xls') {
      impBusy(file.name, ['Loading spreadsheet reader', 'Reading file', 'Matching columns']);
      await loadXLSX(); stepBusy();
      const wb = XLSX.read(await file.arrayBuffer()); stepBusy(); // raw serials; normDate() converts
      return impFinishTemplate(file.name, XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: '' }));
    }
    if (['pdf', 'docx', 'png', 'jpg', 'jpeg'].includes(ext)) return simulatePO(file.name);
    impFail('Unsupported file type', `“.${ext}” can’t be imported. Use CSV or XLSX for templates, or PDF, DOCX, JPG or PNG for purchase orders.`);
  } catch (err) { impFail('Couldn’t read the file', err.message || String(err)); }

function suggestAssignees() {
  const im = state.imp, p = proj(im.projectId), b = store.boards[p.id], load = {};
  const cards = Object.values(b.cards).filter(c => !c.archived && !b.lists.find(l => l.cardIds.includes(c.id))?.isDone);
  const span = o => [o.start || o.due, o.due || o.start];
  const overlaps = (c, r) => { const [s, e] = span(c), [rs, re] = span(r); return s && rs && s <= re && e >= rs; };
  let n = 0;
  im.rows.filter(r => r.include && !r.assignee).forEach(r => {
    let best = null, bestScore = -Infinity;
    p.members.forEach(id => {
      const mine = Object.values(b.cards).filter(c => c.assignees.includes(id));
      const affinity = r.label ? mine.filter(c => c.labels.includes(r.label)).length : 0;
      const busy = cards.filter(c => c.assignees.includes(id) && overlaps(c, r)).length + (load[id] || 0);
      const score = affinity * 2 - busy;
      if (score > bestScore) { bestScore = score; best = id; }
    });
    if (best) { r.assignee = best; r.suggested = true; load[best] = (load[best] || 0) + 1; n++; r.warnings0 = r.warnings0.filter(w => w.f !== 'assignee'); }
  });
  im.rows.forEach(validateRow); renderApp();
  toast({ type: 'info', title: n ? `Suggested owners for ${n} row${n === 1 ? '' : 's'}` : 'All selected rows already have an owner', desc: n ? 'Based on experience with the label and workload on the same dates. Change any you disagree with.' : '' });
}

/* =====================================================================
   COMPONENTS: ReportsPage (project documents) + DocViewer
   Source: reports/<project-folder>/*.pdf, indexed into reports/manifest.js
   by tools/build_reports_manifest.py (a static page cannot list folders).
   Folder name = slug of the project name: "Website Redesign" → website-redesign.
   Real build: GET /api/tracking/projects/:id/documents + signed file URLs.
   ===================================================================== */
const slugify = s => String(s).toLowerCase().normalize('NFKC').replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-+|-+$/g, '');
const fmtSize = b => b < 1024 ? `${b} B` : b < 1048576 ? `${Math.round(b / 1024)} KB` : `${(b / 1048576).toFixed(1)} MB`;
const fmtDateTime = s => new Date(s).toLocaleString(LOC(), { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
// only PDFs inside reports/, no parent-directory hops
const safeDoc = f => typeof f?.path === 'string' && /^reports\/.+\.pdf$/i.test(f.path) && !f.path.split('/').includes('..');
const docSrc = p => p.split('/').map(encodeURIComponent).join('/');

function reportFolders() {
  const m = window.REPORTS_MANIFEST; if (!m || !Array.isArray(m.folders)) return null;
  const folders = m.folders.map(f => ({ folder: String(f.folder), files: (f.files || []).filter(safeDoc) }));
  const by = Object.fromEntries(folders.map(f => [f.folder, f]));
  const list = allProjects()
    .map(p => ({ slug: slugify(p.name), name: p.name, files: by[slugify(p.name)]?.files || [] }));
  // folders that match no project at all still show, under their folder name
  folders.filter(f => !store.projects.some(p => slugify(p.name) === f.folder)).forEach(f => list.push({ slug: f.folder, name: f.folder, files: f.files }));
  return list;
}
function loadManifest() {
  return new Promise(res => {
    document.querySelectorAll('script[data-manifest]').forEach(s => s.remove());
    const s = document.createElement('script');
    s.src = `reports/manifest.js?t=${Date.now()}`; s.charset = 'utf-8'; s.dataset.manifest = '1';
    s.onload = s.onerror = () => res();
    document.head.appendChild(s);
  });
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]');
  const menuAction = t && ['list-menu', 'toggle-archived'].includes(t.dataset.action);
  if (!menuAction && !e.target.closest('[role="menu"]') && closeMenus()) renderApp();
  if (e.target.matches('[data-backdrop="modal"]')) return closeModal();
  if (e.target.matches('[data-backdrop="viewer"]')) return closeViewer();
  const opt = e.target.closest('[data-mention]'); if (opt) return insertMention(opt.dataset.mention);
  if (t) { if (t.tagName === 'A') e.preventDefault(); const fn = actions[t.dataset.action]; if (fn) { e.stopPropagation(); fn(t.dataset.value); } return; }
  const docEl = e.target.closest('[data-doc]'); if (docEl) return selectDoc(docEl);
  if (e.target.closest('[data-card-id] label, [data-card-id] input')) return;
  const cardEl = e.target.closest('[data-card-id]'); if (cardEl) openCard(cardEl.dataset.cardId);
});

document.addEventListener('change', e => {
  const el = e.target, c = state.openCardId && getCard(state.openCardId);
  if (el.id === 'sim-error') { state.simulateError = el.checked; return; }
  if (el.dataset.filter) { state.filters[el.dataset.filter] = el.value; render(); return; }
  if (el.dataset.cardCheck) {
    const item = board().cards[el.dataset.cardCheck]?.checklist.find(i => i.id === el.dataset.item);
    if (item) { item.done = el.checked; render(); }
    return;
  }
  if (!c) return;
  if (el.dataset.field === 'list') { moveCard(c.id, el.value, null); return; }
  if (el.dataset.field === 'priority') return updateCard(c => c.priority = el.value);
  if (el.dataset.field === 'start' || el.dataset.field === 'due') {
    const next = { start: c.start, due: c.due, [el.dataset.field]: el.value || null };
    if (next.start && next.due && next.due < next.start) { toast({ type: 'error', title: 'Invalid dates', desc: 'Due date must be on or after the start date.' }); renderPanel(); return; }
    return updateCard(c => c[el.dataset.field] = el.value || null);
  }
  if (el.dataset.assignee) return updateCard(c => c.assignees = el.checked ? [...c.assignees, el.dataset.assignee] : c.assignees.filter(x => x !== el.dataset.assignee));
  if (el.dataset.labelToggle) return updateCard(c => c.labels = el.checked ? [...c.labels, el.dataset.labelToggle] : c.labels.filter(x => x !== el.dataset.labelToggle));
  if (el.dataset.check) return updateCard(c => { const i = c.checklist.find(x => x.id === el.dataset.check); i.done = el.checked; });
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'board-search') { state.search = el.value; renderApp(); return; }
  if (el.id === 'rep-search') { state.reports.q = el.value; renderApp(); return; }
  if (el.dataset.draft) state.drafts[el.dataset.draft] = el.value;
  if (el.closest('#project-form') && el.type === 'checkbox') { const chk = el.parentElement.querySelector('span:last-child'); chk?.classList.toggle('invisible', !el.checked); }
  const c = state.openCardId && getCard(state.openCardId);
  if (c && el.dataset.field === 'title') { autosize(el); if (el.value.trim()) { c.title = el.value.replace(/\n/g, ' '); renderApp(); } }
  if (c && el.dataset.field === 'desc') c.desc = el.value;
  if (el.id === 'comment-input') {
    const before = el.value.slice(0, el.selectionStart), m = before.match(/(^|\s)@(\w*)$/);
    mention = m ? { query: m[2], start: el.selectionStart - m[2].length - 1, idx: 0 } : null;
    $('#mention-box').innerHTML = MentionList();
    el.setAttribute('aria-expanded', !!mention); mention ? el.setAttribute('aria-activedescendant', 'mo-0') : el.removeAttribute('aria-activedescendant');

});

/* dashboard scope + import form controls */

});
document.addEventListener('input', e => {

/* file drop on the import dropzone (and stop the browser opening files dropped elsewhere) */
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
document.addEventListener('dragover', e => {
  if (drag || !hasFiles(e)) return; e.preventDefault();
  const z = e.target.closest?.('[data-dropzone]');
  document.querySelectorAll('[data-dropzone].drag-over').forEach(n => n !== z && n.classList.remove('drag-over'));
  if (z) { z.classList.add('drag-over'); e.dataTransfer.dropEffect = 'copy'; } else e.dataTransfer.dropEffect = 'none';
});
document.addEventListener('dragleave', e => { const z = e.target.closest?.('[data-dropzone]'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('drag-over'); });
document.addEventListener('drop', e => {
  if (drag || !hasFiles(e)) return; e.preventDefault();
  const z = e.target.closest?.('[data-dropzone]');
  document.querySelectorAll('[data-dropzone].drag-over').forEach(n => n.classList.remove('drag-over'));
  if (z && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});

/* Board ↕ Timeline splitter: pointer drag (mouse, pen, touch), keyboard, double-click */
let splitDrag = null;
document.addEventListener('pointerdown', e => {
  if (!e.target.closest?.('#splitter') || e.button !== 0) return;
  e.preventDefault(); splitDrag = { moved: false, v: null };
  document.body.style.cursor = 'row-resize'; document.body.style.userSelect = 'none';
});
document.addEventListener('pointermove', e => {
  if (!splitDrag) return;
  if (!splitDrag.moved) {
    splitDrag.moved = true;
    if (state.boardCollapsed || !state.ganttOpen) { state.boardCollapsed = false; state.ganttOpen = true; render(); }
    $('#splitter')?.classList.add('is-resizing');
  }
  const wrap = $('#split-wrap'); if (!wrap) return;
  const r = wrap.getBoundingClientRect(), v = Math.min(0.97, Math.max(0.03, (e.clientY - r.top) / r.height));
  splitDrag.v = v;
  $('#sec-board').style.flex = `${v} 1 0%`; $('#sec-gantt').style.flex = `${1 - v} 1 0%`;
});
const endSplitDrag = () => {
  if (!splitDrag) return; const { moved, v } = splitDrag; splitDrag = null;
  document.body.style.cursor = ''; document.body.style.userSelect = '';
  $('#splitter')?.classList.remove('is-resizing');
  if (moved && v != null) setSplit(v);
};
document.addEventListener('pointerup', endSplitDrag);
document.addEventListener('pointercancel', endSplitDrag);
document.addEventListener('dblclick', e => { if (e.target.closest?.('#splitter')) setSplit(0.5); });
document.addEventListener('keydown', e => {
  if (e.target.id !== 'splitter') return;
  const cur = !state.boardCollapsed && state.ganttOpen ? state.split : state.boardCollapsed ? 0.1 : 0.9;
  const next = { ArrowUp: cur - 0.05, ArrowDown: cur + 0.05, Home: 0.15, End: 0.85, Enter: 0.5 }[e.key];
  if (next == null) return; e.preventDefault(); setSplit(next);
});

/* Reports: double-click / Enter opens a document; arrows move between rows */
document.addEventListener('dblclick', e => {
  const d = e.target.closest?.('[data-doc]');
  if (d && !e.target.closest('[data-action]')) { e.preventDefault(); openDoc(d.dataset.doc); }
});
document.addEventListener('keydown', e => {
  const d = e.target.dataset?.doc ? e.target : null; if (!d) return;
  const rows = [...document.querySelectorAll('[data-doc]')], i = rows.indexOf(d);
  const go = j => { if (rows[j]) selectDoc(rows[j]); };
  if (e.key === 'Enter') { e.preventDefault(); openDoc(d.dataset.doc); }
  else if (e.key === ' ') { e.preventDefault(); selectDoc(d); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); go(i + 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); go(i - 1); }
  else if (e.key === 'Home') { e.preventDefault(); go(0); }
  else if (e.key === 'End') { e.preventDefault(); go(rows.length - 1); }
});

/* chart hover tooltip */
document.addEventListener('mousemove', e => {
  const tip = $('#tip'), t = e.target.closest?.('[data-tip]');
  if (!t) { if (!tip.hidden) tip.hidden = true; return; }
  tip.textContent = t.dataset.tip; tip.hidden = false;
  tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + 'px';
  tip.style.top = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8) + 'px';
});

function insertMention(handle) {
  const el = $('#comment-input'); if (!el || !mention) return;
  const caret = el.selectionStart ?? el.value.length;
  el.value = el.value.slice(0, mention.start) + '@' + handle + ' ' + el.value.slice(caret);
  const pos = mention.start + handle.length + 2; mention = null; state.drafts.comment = el.value;
  $('#mention-box').innerHTML = ''; el.setAttribute('aria-expanded', 'false'); el.removeAttribute('aria-activedescendant');
  el.focus(); el.setSelectionRange(pos, pos);
}

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, kind = f.dataset.form;
  if (f.id === 'project-form') return submitProject(f);
  if (kind === 'add-card') { const v = f.title.value.trim(); if (!v) return; state.pendingFocus = 'addcard-' + f.dataset.list; addCard(f.dataset.list, v); return; }
  if (kind === 'add-list') {
    const v = f.name.value.trim(); if (!v) return; const b = board(), l = { id: uid('L'), name: v, cardIds: [] };
    b.lists.push(l); state.pendingFocus = 'addlist';
    persist('list:' + l.id, () => { b.lists = b.lists.filter(x => x !== l); }, null, `List ${v} added.`);
    requestAnimationFrame(() => { const s = $('#board-scroll'); s.scrollLeft = s.scrollWidth; });
    return;
  }
  if (kind === 'add-check') { const v = f.text.value.trim(); if (!v) return; state.drafts.check = ''; state.pendingFocus = 'add-check'; updateCard(c => c.checklist.push({ id: uid('ci'), text: v, done: false })); return; }
  if (kind === 'comment') {
    const v = f.text.value.trim(); if (!v) return; state.drafts.comment = ''; mention = null; state.pendingFocus = 'comment';
    updateCard(c => c.comments.push({ id: uid('cm'), author: ME, text: v, at: Date.now() }));
    const tagged = [...v.matchAll(/@(\w+)/g)].map(m => m[1]).filter(h => MEMBERS.some(x => x.handle === h));
    toast({ type: 'success', title: 'Comment posted', desc: tagged.length ? `Notified ${tagged.map(h => '@' + h).join(', ')}` : '' });
  }
});

function submitProject(form) {
  const fd = new FormData(form), errors = {};
  const f = { name: fd.get('name').trim(), desc: fd.get('desc').trim(), owner: fd.get('owner'), start: fd.get('start'), end: fd.get('end'), members: fd.getAll('members') };
  if (f.name.length < 2) errors.name = 'Enter a project name (at least 2 characters).';
  if (f.start && f.end && f.end < f.start) errors.end = 'End date must be on or after the start date.';
  state.form = { ...f, errors };
  if (Object.keys(errors).length) { renderModal(); focusKey(errors.name ? 'pf-name' : ''); if (!errors.name) $('#pf-end')?.focus(); return; }
  state.form.saving = true; renderModal();
  setTimeout(() => {
    if (state.simulateError) { state.form.saving = false; renderModal(); toast({ type: 'error', title: 'Couldn’t create project', desc: 'Your details are kept. Try again in a moment.' }); return; }
    const id = uid('p');
    store.projects.push({ id, ...f, members: [...new Set([f.owner, ...f.members])], status: 'active' });
    store.boards[id] = { lists: ['Backlog', 'To Do', 'In Progress', 'Done'].map((n, i) => ({ id: uid('L'), name: n, cardIds: [], isDone: i === 3 })), cards: {} };
    state.modal = false; state.statusFilter = 'all'; renderModal(); renderApp();
    toast({ type: 'success', title: 'Project created', desc: f.name, action: { label: 'Open board', fn: () => openProject(id) } });
    focusKey('proj-' + id);
  }, 650);
}

/* rename list: commit on Enter / blur */
function commitRename(el, save) {
  const l = board().lists.find(x => x.id === el.dataset.renameList); if (!l) return;
  const v = el.value.trim(); state.renamingList = null;
  if (save && v && v !== l.name) { const old = l.name; l.name = v; persist('list:' + l.id, () => { l.name = old; }, null, `List renamed to ${v}.`); }
  else render();
}
document.addEventListener('focusout', e => { if (e.target.dataset?.renameList && state.renamingList) commitRename(e.target, true); });

/* keyboard */
function trapTab(e, root) {
  const f = [...root.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]):not(.sr-only),select,textarea,summary,[tabindex]:not([tabindex="-1"])')].filter(x => x.offsetParent !== null || x.matches('summary'));
  const cbs = [...root.querySelectorAll('input.sr-only')]; f.push(...cbs);
  if (!f.length) return; const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

document.addEventListener('keydown', e => {
  const el = e.target;
  // mention combobox
  if (el.id === 'comment-input') {
    if (mention) {
      const n = mentionOptions().length;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!n) return; mention.idx = (mention.idx + (e.key === 'ArrowDown' ? 1 : -1) + n) % n; $('#mention-box').innerHTML = MentionList(); el.setAttribute('aria-activedescendant', 'mo-' + mention.idx); return; }
      if ((e.key === 'Enter' || e.key === 'Tab') && n) { e.preventDefault(); insertMention(mentionOptions()[mention.idx].handle); return; }
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); mention = null; $('#mention-box').innerHTML = ''; el.setAttribute('aria-expanded', 'false'); return; }
    }
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); el.form.requestSubmit(); return; }
  }
  if (el.dataset?.field === 'title' && e.key === 'Enter') { e.preventDefault(); el.blur(); return; }
  if (el.dataset?.renameList) { if (e.key === 'Enter') { e.preventDefault(); commitRename(el, true); state.pendingFocus = 'lgrip-' + el.dataset.renameList; } if (e.key === 'Escape') { e.preventDefault(); commitRename(el, false); } return; }
  if (el.closest?.('[data-form="add-card"]') && el.tagName === 'TEXTAREA') {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); el.form.requestSubmit(); return; }
    if (e.key === 'Escape') { e.preventDefault(); actions['add-card-cancel'](); return; }
  }
  if (el.closest?.('[data-form="add-list"]') && e.key === 'Escape') { actions['add-list-cancel'](); return; }

  // focus traps
  if (e.key === 'Tab') { const dlg = $('#viewer-root [role="dialog"]') || $('#modal-root [role="dialog"]') || $('#panel-root [role="dialog"]'); if (dlg) trapTab(e, dlg); return; }

  // menus: arrow roving
  const menu = el.closest?.('[role="menu"]');
  if (menu && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    e.preventDefault(); const items = [...menu.querySelectorAll('[role^="menuitem"]')]; const i = items.indexOf(el);
    items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length]?.focus(); return;
  }

  if (e.key === 'Escape') {
    if (state.viewer) { closeViewer(); return; }
    if (closeMenus()) { renderApp(); return; }
    if (state.modal) { closeModal(); return; }
    if (state.openCardId) { closePanel(); return; }
    if (state.addingCard) { actions['add-card-cancel'](); return; }
  }

  const typing = /INPUT|TEXTAREA|SELECT/.test(el.tagName);
  if (e.key === '/' && !typing && state.view === 'board' && !state.openCardId && !state.modal) { e.preventDefault(); focusKey('search'); return; }

  // list grip: Alt+Left/Right moves list
  if (el.dataset?.listDrag && e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    e.preventDefault(); const b = board(), i = b.lists.findIndex(l => l.id === el.dataset.listDrag); moveList(el.dataset.listDrag, i + (e.key === 'ArrowLeft' ? -1 : 1), true); return;
  }

  // cards
  if (el.dataset?.cardId) cardKeys(e, el.dataset.cardId);
});

function cardKeys(e, id) {
  const b = board(), list = listOfCard(id), li = b.lists.indexOf(list);
  const vis = l => l.cardIds.filter(c => !b.cards[c].archived && matches(b.cards[c]));
  const k = e.key;
  if (k === 'Enter' || k === ' ') { e.preventDefault(); openCard(id); return; }
  if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(k)) return;
  e.preventDefault();
  const v = vis(list), idx = v.indexOf(id);
  if (e.altKey) {
    if (k === 'ArrowUp' && idx > 0) moveCard(id, list.id, v[idx - 1], true);
    if (k === 'ArrowDown' && idx < v.length - 1) moveCard(id, list.id, v[idx + 2] || null, true);
    if (k === 'ArrowLeft' || k === 'ArrowRight') { const t = b.lists[li + (k === 'ArrowLeft' ? -1 : 1)]; if (t) moveCard(id, t.id, vis(t)[idx] || null, true); }
    return;
  }
  if (k === 'ArrowUp' || k === 'ArrowDown') { const n = v[idx + (k === 'ArrowUp' ? -1 : 1)]; if (n) focusKey('card-' + n); return; }
  const dir = k === 'ArrowLeft' ? -1 : 1;
  for (let j = li + dir; j >= 0 && j < b.lists.length; j += dir) { const t = vis(b.lists[j]); if (t.length) { focusKey('card-' + t[Math.min(idx, t.length - 1)]); return; } }
}

/* =====================================================================
   DRAG & DROP (HTML5) with drop indicators + optimistic commit
   ===================================================================== */
function clearDragUi() {
  document.querySelectorAll('.drop-ind,.list-drop').forEach(n => n.remove());
  document.querySelectorAll('.drag-over').forEach(n => n.classList.remove('drag-over'));
  document.querySelectorAll('.is-dragging').forEach(n => n.classList.remove('is-dragging'));
}
document.addEventListener('dragstart', e => {
  const grip = e.target.closest?.('[data-list-drag]'), cardEl = e.target.closest?.('[data-card-id]');
  if (grip) {
    const col = grip.closest('[data-list-id]'); drag = { type: 'list', id: grip.dataset.listDrag };
    e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', drag.id); e.dataTransfer.setDragImage(col, 24, 20);
    requestAnimationFrame(() => col.classList.add('is-dragging')); return;
  }
  if (cardEl) {
    drag = { type: 'card', id: cardEl.dataset.cardId }; closeMenus();
    e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', drag.id);
    requestAnimationFrame(() => cardEl.classList.add('is-dragging'));
  }
});
document.addEventListener('dragover', e => {
  if (!drag) return;
  const scroll = $('#board-scroll'); if (!scroll) return;
  // auto-scroll horizontally near edges
  const r = scroll.getBoundingClientRect();
  if (e.clientX < r.left + 60) scroll.scrollLeft -= 12; else if (e.clientX > r.right - 60) scroll.scrollLeft += 12;

  if (drag.type === 'card') {
    const col = e.target.closest?.('[data-list-id]'); if (!col) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'move';
    document.querySelectorAll('.drag-over').forEach(n => n !== col && n.classList.remove('drag-over')); col.classList.add('drag-over');
    const ol = col.querySelector('[data-cards]');
    const items = [...ol.querySelectorAll('[data-card-id]:not(.is-dragging)')];
    let i = items.findIndex(x => { const b = x.getBoundingClientRect(); return e.clientY < b.top + b.height / 2; }); if (i < 0) i = items.length;
    const ref = items[i] || null; let ind = document.querySelector('.drop-ind');
    if (!ind) { ind = document.createElement('li'); ind.className = 'drop-ind'; ind.setAttribute('aria-hidden', 'true'); }
    if (ind.parentElement !== ol || ind.nextElementSibling !== ref) ref ? ol.insertBefore(ind, ref) : ol.appendChild(ind);
    drag.target = { listId: col.dataset.listId, beforeId: ref?.dataset.cardId || null };
  } else {
    if (!scroll.contains(e.target)) return; e.preventDefault();
    const cols = [...scroll.querySelectorAll('[data-list-id]')].filter(c => c.dataset.listId !== drag.id);
    let i = cols.findIndex(c => { const b = c.getBoundingClientRect(); return e.clientX < b.left + b.width / 2; }); if (i < 0) i = cols.length;
    const ref = cols[i] || scroll.querySelector('[data-action="add-list-open"],[data-form="add-list"]');
    let ind = document.querySelector('.list-drop'); if (!ind) { ind = document.createElement('div'); ind.className = 'list-drop'; ind.setAttribute('aria-hidden', 'true'); }
    if (ind.nextElementSibling !== ref) scroll.insertBefore(ind, ref);
    drag.toIndex = i;
  }
});
document.addEventListener('drop', e => {
  if (!drag) return; e.preventDefault(); const d = drag; drag = null; clearDragUi();
  if (d.type === 'card' && d.target) moveCard(d.id, d.target.listId, d.target.beforeId);
  if (d.type === 'list' && d.toIndex != null) moveList(d.id, d.toIndex);
});
document.addEventListener('dragend', () => { drag = null; clearDragUi(); });

/* =====================================================================
   THEME + BOOT
   ===================================================================== */
function paintThemeBtn() { $('#theme-toggle').innerHTML = icon(document.documentElement.classList.contains('dark') ? 'sun' : 'moon'); }
$('#theme-toggle').addEventListener('click', () => {
  const dark = document.documentElement.classList.toggle('dark');
  try { localStorage.setItem('pt-theme', dark ? 'dark' : 'light'); } catch (e) {}
  paintThemeBtn();
});
paintThemeBtn();
$('#lang-toggle').addEventListener('click', () => setLang(state.lang === 'th' ? 'en' : 'th'));
document.documentElement.lang = state.lang;
paintLangToggle();
translateTree(document.body); // static shell text (header, sidebar heading, demo panel)
impReset();
// re-render when crossing breakpoints that change markup (table↔cards, gantt widths)
['(max-width: 639px)', '(max-width: 1023px)'].forEach(q => window.matchMedia(q).addEventListener('change', () => {
  if (isMobile() && state.ganttOpen && !state.boardCollapsed) state.boardCollapsed = true;
  render();
}));
render();
setTimeout(() => { state.loading = false; render(); }, 700);
</script>
